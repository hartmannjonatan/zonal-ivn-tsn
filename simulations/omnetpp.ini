include zonal/configs/base.ini
include zonal/configs/topology.ini
include zonal/configs/recording.ini
include ../tests/validation/topology/connectivity.ini

include zonal/configs/catalog-bindings.ini
include zonal/configs/classification.ini
include zonal/configs/loads.ini
include zonal/configs/aggregation.ini
include zonal/configs/traffic.ini

[General]
# Local copies of the original INET vehicle background and camera icon.
image-path = ../images
network = zonal_ivn_tsn.simulations.zonal.networks.ZonalIVN

[Config TopologyValidation]
extends = Base, Topology, Recording
description = "P1 complete topology: visual inspection, no application traffic"
result-dir = results/topology

# Keep the previous entry point available.
[Config SmokeTest]
extends = TopologyValidation
description = "Alias for TopologyValidation (complete topology, no traffic)"

[Config Traffic_L0_A0]
extends = TrafficCatalog, L0, A0

[Config Traffic_L0_A1]
extends = TrafficCatalog, L0, A1

[Config Traffic_L1_A0]
extends = TrafficCatalog, L1, A0

[Config Traffic_L1_A1]
extends = TrafficCatalog, L1, A1

[Config Traffic_L2_A0]
extends = TrafficCatalog, L2, A0

[Config Traffic_L2_A1]
extends = TrafficCatalog, L2, A1

[Config Traffic_L3_A0]
extends = TrafficCatalog, L3, A0

[Config Traffic_L3_A1]
extends = TrafficCatalog, L3, A1

[Config Validate_L0_A0]
extends = TrafficValidation, L0, A0

[Config Validate_L0_A1]
extends = TrafficValidation, L0, A1

[Config Validate_L1_A0]
extends = TrafficValidation, L1, A0

[Config Validate_L1_A1]
extends = TrafficValidation, L1, A1

[Config Validate_L2_A0]
extends = TrafficValidation, L2, A0

[Config Validate_L2_A1]
extends = TrafficValidation, L2, A1

[Config Validate_L3_A0]
extends = TrafficValidation, L3, A0

[Config Validate_L3_A1]
extends = TrafficValidation, L3, A1
