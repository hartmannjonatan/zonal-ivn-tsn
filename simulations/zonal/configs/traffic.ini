# Workload verification entry point; fixed topology, SP carrier, no CBS/TAS.
[Config TrafficCatalog]
extends = CatalogBindings, CatalogClassification, Topology
sim-time-limit = 31.05s
warmup-period = 1s
num-rngs = 3
*.trafficPlan.rng-0 = 1
*.trafficPlan.rng-1 = 2
*.trafficPlan.warmup = 1s
*.trafficPlan.measurement = 30s
# Keep all traffic configurations independently verifiable after the run.
*.trafficPlan.traceReleases = true
*.trafficPlan.outputDirectory = "${resultdir}/${configname}-${runnumber}"
result-dir = results/traffic
# Application measurement is based on generation cohort; leave 50 ms to drain.
**.scalar-recording = true
**.vector-recording = false
**.param-recording = true
**.cmdenv-log-level = off

[Config TrafficValidation]
extends = TrafficCatalog
# Two complete measured seconds exercise both transient streams twice.
sim-time-limit = 2.09s
warmup-period = 40ms
*.trafficPlan.warmup = 40ms
*.trafficPlan.measurement = 2s
*.trafficPlan.traceReleases = true
# The dedicated auditor records every catalog packet; avoid redundant INET statistics.
**.statistic-recording = false
**.param-recording = false
seed-set = 41

[Config ValidateSignatures]
extends = TrafficValidation, L1, A0
sim-time-limit = 10.05s
warmup-period = 0s
*.trafficPlan.warmup = 0s
*.trafficPlan.measurement = 10s
*.trafficPlan.transientsOnly = true
*.trafficPlan.exhaustiveSignatures = true

[Config ValidateReseed]
extends = TrafficValidation, L1, A0
seed-set = 42
