# Diagnostic candidate generated from a P1-infeasible L2/A1 calibration.
# Do not treat as a frozen C3 treatment or as validated C3 results.
[Config C3]
extends = C2
description = "C3 diagnostic candidate only: P1 calibration failed viability; ratios are not frozen"
result-dir = results/C3

[Config ValidateC3]
extends = ValidateC2
description = "Diagnostic candidate only; script stops before matrix unless P1 calibration passes"
result-dir = results/C3/p1-validation-64KiB

# L2/A1 is the sole calibration point; each candidate uses seed 41 and the
# complete P1 warm-up, measurement and drain intervals.
[Config Calibrate_C3_L2_A1]
extends = ValidateC3, C3RatesL2, L2, A1

# L3 is intentionally not executable after the 75% reservation-cap screen.
[Config Validate_C3_L0_A0]
extends = ValidateC3, C3RatesL0, L0, A0
[Config Validate_C3_L0_A1]
extends = ValidateC3, C3RatesL0, L0, A1
[Config Validate_C3_L1_A0]
extends = ValidateC3, C3RatesL1, L1, A0
[Config Validate_C3_L1_A1]
extends = ValidateC3, C3RatesL1, L1, A1
[Config Validate_C3_L2_A0]
extends = ValidateC3, C3RatesL2, L2, A0
[Config Validate_C3_L2_A1]
extends = ValidateC3, C3RatesL2, L2, A1

[Config C3_L0_A0]
extends = C3, C3RatesL0, L0, A0
[Config C3_L0_A1]
extends = C3, C3RatesL0, L0, A1
[Config C3_L1_A0]
extends = C3, C3RatesL1, L1, A0
[Config C3_L1_A1]
extends = C3, C3RatesL1, L1, A1
[Config C3_L2_A0]
extends = C3, C3RatesL2, L2, A0
[Config C3_L2_A1]
extends = C3, C3RatesL2, L2, A1
