# Follow-up F5: controlled phase. A time-aware gate on the Z2/Z3 T1S coordinator
# ports closes the window class (TC3) shortly before every radar release and
# keeps it closed until the radar frame is through, so the radar never waits
# behind a window frame on the PLCA segment. Times are simulation time (ideal
# synchronized clocks, as gPTP would provide; no clock model).
#
# Radar release o (us, every 1 ms). Gate closed from o - 150 us to o + 80 us:
#   150 us = window data TO (67.2 us) + up to one PLCA cycle between the MAC
#            pulling a frame and the coordinator's TO, with margin;
#    80 us = radar wait for its TO + its 57.6 us frame, with margin.
# PeriodicGate: durations [closed 230 us, open 770 us], initiallyOpen = false,
# offset = position in that list at t = 0 = (1150 - o) mod 1000 us.
# The implicit guard band also keeps a window frame from starting if it cannot
# finish before the gate closes.

[Config T1S_RadarPhase_TAS]
extends = T1SNetwork, C0_2s, L1, A0
description = "Radar phase sweep 0-195 us with a TC3 gate on the Z2/Z3 T1S ports around the radar release"
result-dir = results/t1s/radar_phase_TAS
seed-set = 1001
sim-time-limit = 2.05s
*.trafficPlan.measurement = 1s
*.trafficPlan.catalog = xmldoc("../../results/t1s/radar_phase/catalogs/catalog_radar${radarOffset=0..195 step 5}us.xml")
*.Z2.ZSW.eth[2].queue.transmissionGate[3].initiallyOpen = false
*.Z3.ZSW.eth[2].queue.transmissionGate[3].initiallyOpen = false
*.Z2.ZSW.eth[2].queue.transmissionGate[3].durations = [230us, 770us]
*.Z3.ZSW.eth[2].queue.transmissionGate[3].durations = [230us, 770us]
*.Z2.ZSW.eth[2].queue.transmissionGate[3].offset = ((1150 - ${radarOffset}) % 1000) * 1us
*.Z3.ZSW.eth[2].queue.transmissionGate[3].offset = ((1150 - ${radarOffset}) % 1000) * 1us
