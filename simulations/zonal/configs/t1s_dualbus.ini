*.S*[*].bridging.streamIdentifier.identifier.mapping = [{stream: "SR", packetFilter: expr(udp.destPort >= 7100)}]
*.S1[*].bridging.streamCoder.encoder.mapping = [{stream: "SR", vlan: 33, pcp: 7}]
*.S3[*].bridging.streamCoder.encoder.mapping = [{stream: "SR", vlan: 34, pcp: 7}]
# ECUs: one UdpSink per sensor of the other bus.
*.ECU*.app[*].typename = "UdpSink"
*.ECU*.app[*].localPort = 7100 + ancestorIndex(0)
*.ECU*.hasIncomingStreams = true
