# Follow-up F7: load / alignment robustness. L2/L3 x A0/A1, 2 s, seeds 1001-1003.
# The radar flows F06/F07 are scalable: period 1 ms (L1), 400 us (L2), 250 us (L3);
# window and brake are not. C0 is admissible at every load in the benchmark
# (only C3/C4 at L3 are rejected by its reservation screen), but the official
# campaign records C0 L3/A1 failing on camera losses at CSW eth0; C0 is run at
# every cell here as the like-for-like reference.

[Config LoadCells]
*.trafficPlan.loadLevel = ${load=2,3}
*.trafficPlan.aggregation = "${agg=A0,A1}"

[Config C0_LOADS]
extends = LoadCells, C0_L1_A0_2s
description = "C0 reference at L2/L3 x A0/A1"
result-dir = results/t1s/loads/C0

[Config T1S_C0_LOADS]
extends = LoadCells, T1S_C0
description = "T1S_C0 (standard PLCA) at L2/L3 x A0/A1"
result-dir = results/t1s/loads/T1S_C0

[Config T1S_C0_PrioTo_LOADS]
extends = LoadCells, PrioRadarTo, T1S_C0
description = "T1S_C0 with PrioPlca priorityTo for the radar at L2/L3 x A0/A1"
result-dir = results/t1s/loads/T1S_C0_PrioTo

[Config T1S_HYBRID_B6_LOADS]
extends = LoadCells, T1S_HYBRID_B6
description = "Hybrid T1S (8 nodes/segment, 10 ms body flows) at L2/L3 x A0/A1"
result-dir = results/t1s/loads/T1S_HYBRID_B6

# TC3 gate per radar period P (400 us at L2, 250 us at L3): closed from 100 us
# before to 70 us after each radar release (catalog offsets 20 us Z2, 25 us Z3);
# 170 us closed, so a 67.2 us window TO still fits the open part at L3 (80 us).
# offset = (P + 100 - o) mod P  ->  80 us (Z2), 75 us (Z3) at both loads.
# INET's implicit guard band of PeriodicGate aborts these short-period
# schedules ("Scheduled packet from invalid input gate: -1" in the
# PriorityScheduler, L2 and L3) with the PLCA MAC; it is disabled here. The
# 100 us closing lead already covers a window frame pulled just before the
# gate closes (67.2 us TO + margin).
[Config TasGateLoads]
**.transmissionGate[3].enableImplicitGuardBand = false
*.Z2.ZSW.eth[2].queue.transmissionGate[3].initiallyOpen = false
*.Z3.ZSW.eth[2].queue.transmissionGate[3].initiallyOpen = false
*.Z2.ZSW.eth[2].queue.transmissionGate[3].offset = 80us
*.Z3.ZSW.eth[2].queue.transmissionGate[3].offset = 75us

[Config T1S_C0_TAS_L2]
extends = TasGateLoads, T1S_C0
description = "T1S_C0 with the TC3 gate (400 us period) at L2 x A0/A1"
result-dir = results/t1s/loads/T1S_C0_TAS
*.trafficPlan.loadLevel = 2
*.trafficPlan.aggregation = "${agg=A0,A1}"
*.Z2.ZSW.eth[2].queue.transmissionGate[3].durations = [170us, 230us]
*.Z3.ZSW.eth[2].queue.transmissionGate[3].durations = [170us, 230us]

[Config T1S_C0_TAS_L3]
extends = TasGateLoads, T1S_C0
description = "T1S_C0 with the TC3 gate (250 us period) at L3 x A0/A1"
result-dir = results/t1s/loads/T1S_C0_TAS
*.trafficPlan.loadLevel = 3
*.trafficPlan.aggregation = "${agg=A0,A1}"
*.Z2.ZSW.eth[2].queue.transmissionGate[3].durations = [170us, 80us]
*.Z3.ZSW.eth[2].queue.transmissionGate[3].durations = [170us, 80us]
