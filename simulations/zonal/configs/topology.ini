# P1 physical topology; no catalog workload and no C0-C4 traffic treatment.
[Config Topology]
description = "P1 topology: 3 zones, 29 nodes, 28 full-duplex links"

# One static Ethernet tree. Endpoints never route traffic for another node.
**.forwarding = false
**.multicastForwarding = false
**.hasStp = false
**.hasCutthroughSwitching = false
**.hasTimeSynchronization = false
**.hasFramePreemption = false
**.hasStreamRedundancy = false
**.hasEgressTrafficShaping = false
**.bridging.interfaceRelay.learner.typename = ""
**.ipv4.arp.typename = "GlobalArp"

# Assign addresses once at initialization; no routing protocol or ARP packets.
*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/></config>")
*.configurator.addStaticRoutes = true

# Applications default to zero in INET. Do not set a wildcard numApps here:
# later catalog configurations and the isolated connectivity checks override it.

# LayeredEthernetInterface requires an explicit bitrate matching each channel.
*.HPC.eth[*].bitrate = 1Gbps
*.CSW.eth[*].bitrate = 1Gbps
*.Z*.ZCPU.eth[*].bitrate = 1Gbps
*.Z*.ZSW.eth[0..1].bitrate = 1Gbps
*.Z1.ZSW.eth[2..3].bitrate = 1Gbps
*.Z2.ZSW.eth[3].bitrate = 1Gbps
*.Z3.ZSW.eth[3..4].bitrate = 1Gbps
*.LiDAR1.eth[*].bitrate = 1Gbps
*.CAM*.eth[*].bitrate = 1Gbps
**.eth[*].bitrate = 100Mbps
