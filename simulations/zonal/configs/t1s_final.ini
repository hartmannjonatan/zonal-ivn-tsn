# Follow-up F6: final statistics. 1 s warm-up, 30 s measurement, 50 ms drain
# (the P1 timing), L1/A0, seeds 1001-1010, latency vectors only.

[Config C0_30s]
extends = C0
description = "Abstract: C0 with the P1 timing (1 s warm-up + 30 s measurement), latency vectors only"
sim-time-limit = 31.05s
warmup-period = 1s
*.trafficPlan.warmup = 1s
*.trafficPlan.measurement = 30s
**.app[*].latency:vector.vector-recording = true
**.vector-recording = false
**.app[*].latency.result-recording-modes = vector
**.param-recording = true
**.propagationTime.statistic-recording = false

[Config C0_L1_A0_30s]
extends = C0_30s, L1, A0
description = "C0 on ZonalIVN, 30 s, seeds 1001-1010 (reference)"
result-dir = results/t1s/final/C0_L1_A0_30s
seed-set = ${seed=1001..1010}

[Config T1S_C0_30s]
extends = T1SNetwork, C0_30s, L1, A0
description = "T1S_C0 (WINDOW/RADAR on T1S, standard PLCA), 30 s, seeds 1001-1010"
result-dir = results/t1s/final/T1S_C0_30s
seed-set = ${seed=1001..1010}

[Config T1S_C0_PrioTo_30s]
extends = PrioRadarTo, T1SNetwork, C0_30s, L1, A0
description = "T1S_C0 with PrioPlca priorityTo for the radar (Z2/Z3), 30 s, seeds 1001-1010"
result-dir = results/t1s/final/T1S_C0_PrioTo_30s
seed-set = ${seed=1001..1010}

# TC3 gate around the catalog radar releases (F06 20 us in Z2, F07 25 us in Z3);
# same 230 us closed window as T1S_RadarPhase_TAS (see t1s_phase.ini).
[Config T1S_C0_TAS_30s]
extends = T1SNetwork, C0_30s, L1, A0
description = "T1S_C0 with a TC3 gate around the radar release on the Z2/Z3 T1S ports, 30 s, seeds 1001-1010"
result-dir = results/t1s/final/T1S_C0_TAS_30s
seed-set = ${seed=1001..1010}
*.Z2.ZSW.eth[2].queue.transmissionGate[3].initiallyOpen = false
*.Z3.ZSW.eth[2].queue.transmissionGate[3].initiallyOpen = false
*.Z2.ZSW.eth[2].queue.transmissionGate[3].durations = [230us, 770us]
*.Z3.ZSW.eth[2].queue.transmissionGate[3].durations = [230us, 770us]
*.Z2.ZSW.eth[2].queue.transmissionGate[3].offset = 130us
*.Z3.ZSW.eth[2].queue.transmissionGate[3].offset = 125us
