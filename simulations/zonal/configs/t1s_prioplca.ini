# PrioPlca (../prioplca, from Jean Macedo's plca-priority-to repository) as the
# PLCA layer of every 10BASE-T1S interface. Only EthernetPlcaInterface has a
# "plca" submodule, so **.plca.* touches the T1S ports and nodes only.
# Run via zonal_t1s_prioplca.ini with "-n ...:../prioplca -l ../prioplca/prioplca".
#
# Modes (all nodes of a segment must use the same mode):
#   standard   : identical to INET EthernetPlca.
#   priorityTo : after every TO that carried data, a priority TO (128 bit,
#                16 bit commit guard) owned by priorityNodeID. Must be > 0, so
#                the coordinator (ZSW, ID 0) can never own it.
#   multiTo    : static slot list slotOwners; plca_node_count = list length.
# Z1 has no upstream critical node (no radar), so priorityTo leaves Z1 in
# standard mode.

[Config PrioStd]
**.plca.typename = "PrioPlca"
**.plca.mode = "standard"

# priorityTo for the radar (PLCA ID 1) on Z2/Z3.
[Config PrioRadarTo]
**.plca.typename = "PrioPlca"
*.Z1.ZSW.eth[*].plca.mode = "standard"
*.WINDOW1.eth[0].plca.mode = "standard"
*.BRAKE1.eth[0].plca.mode = "standard"
*.X1[*].eth[0].plca.mode = "standard"
**.plca.mode = "priorityTo"
**.plca.priorityNodeID = 1

# Extra-node delay: HPC app[20] becomes INET UdpSink (records endToEndDelay).
[Config XDelay]
*.HPC.app[20].typename = "UdpSink"
*.HPC.app[20].localPort = 6000
**.HPC.app[20].endToEndDelay:vector.vector-recording = true
**.HPC.app[20].endToEndDelay.result-recording-modes = vector

# ---------------------------------------------------------------- sanity
[Config T1S_C0_PrioStd]
extends = PrioStd, T1S_C0
description = "T1S_C0 with PrioPlca in standard mode (must equal T1S_C0)"
result-dir = results/t1s/prioplca/T1S_C0_PrioStd

# ---------------------------------------------------------------- radar phase
# Worst-offset band from T1S_RadarPhase (F06 45-120 us, F07 55-130 us).
# Same settings as T1S_RadarPhase (seed 1001, 1 s measurement); defined
# standalone because an iteration variable cannot be redefined.
[Config RadarPhaseHi]
extends = T1SNetwork, C0_2s, L1, A0
seed-set = 1001
sim-time-limit = 2.05s
*.trafficPlan.measurement = 1s
*.trafficPlan.catalog = xmldoc("../../results/t1s/radar_phase/catalogs/catalog_radar${radarOffset=45..130 step 5}us.xml")

[Config T1S_RadarPhase_PrioTo]
extends = PrioRadarTo, RadarPhaseHi
description = "Radar phase sweep 45-130 us with priorityTo for the radar"
result-dir = results/t1s/prioplca/radar_phase_PrioTo

# Radar owns every other slot: Z2/Z3 cycle 0 1 2 1 (4 slots).
[Config T1S_RadarPhase_MultiTo]
extends = RadarPhaseHi
description = "Radar phase sweep 45-130 us with multiTo (radar owns 2 of 4 slots)"
result-dir = results/t1s/prioplca/radar_phase_MultiTo
**.plca.typename = "PrioPlca"
*.Z1.ZSW.eth[*].plca.mode = "standard"
*.WINDOW1.eth[0].plca.mode = "standard"
**.plca.mode = "multiTo"
*.plcaNodeCountZ2 = 4
*.plcaNodeCountZ3 = 4
**.plca.slotOwners = "0 1 2 1"

# ---------------------------------------------------------------- brake
[Config T1S_BRAKE_PrioTo]
extends = PrioRadarTo, T1S_BRAKE
description = "T1S_BRAKE with priorityTo for the radar (Z2/Z3)"
result-dir = results/t1s/prioplca/T1S_BRAKE_PrioTo

# Brake frames come from the coordinator (ID 0), which priorityTo cannot
# favour; multiTo gives the coordinator every other slot instead.
#   Z1: 0 1 0 2      Z2/Z3: 0 1 0 2 0 3
[Config T1S_BRAKE_MultiToCoord]
extends = T1S_BRAKE
description = "T1S_BRAKE with multiTo: coordinator owns every other slot"
result-dir = results/t1s/prioplca/T1S_BRAKE_MultiToCoord
**.plca.typename = "PrioPlca"
**.plca.mode = "multiTo"
*.plcaNodeCountZ1 = 4
*.plcaNodeCountZ2 = 6
*.plcaNodeCountZ3 = 6
*.Z1.**.plca.slotOwners = "0 1 0 2"
*.WINDOW1.eth[0].plca.slotOwners = "0 1 0 2"
*.BRAKE1.eth[0].plca.slotOwners = "0 1 0 2"
**.plca.slotOwners = "0 1 0 2 0 3"

# Coordinator every other slot and the radar twice per cycle (Z2/Z3).
#   Z1: 0 1 0 2      Z2/Z3: 0 1 0 2 0 1 0 3
[Config T1S_BRAKE_MultiToCoordRadar]
extends = T1S_BRAKE_MultiToCoord
description = "T1S_BRAKE with multiTo: coordinator every other slot, radar twice per cycle"
result-dir = results/t1s/prioplca/T1S_BRAKE_MultiToCoordRadar
*.plcaNodeCountZ2 = 8
*.plcaNodeCountZ3 = 8
*.Z1.**.plca.slotOwners = "0 1 0 2"
*.WINDOW1.eth[0].plca.slotOwners = "0 1 0 2"
*.BRAKE1.eth[0].plca.slotOwners = "0 1 0 2"
**.plca.slotOwners = "0 1 0 2 0 1 0 3"

# ---------------------------------------------------------------- extra nodes
# Inherits ${extra=0,2,5} from T1SExtraNetwork; run with -r '$extra>0' for
# the 5- and 8-node segments. Standard mode is rerun with XDelay so the extra
# nodes' delay is comparable across modes.
[Config ExtraModes]
extends = XDelay

[Config T1S_EXTRA_SENSOR_Std]
extends = ExtraModes, PrioStd, T1S_EXTRA_SENSOR
result-dir = results/t1s/prioplca/T1S_EXTRA_SENSOR_Std
[Config T1S_EXTRA_SENSOR_PrioTo]
extends = ExtraModes, PrioRadarTo, T1S_EXTRA_SENSOR
result-dir = results/t1s/prioplca/T1S_EXTRA_SENSOR_PrioTo
[Config T1S_EXTRA_HEAVY_Std]
extends = ExtraModes, PrioStd, T1S_EXTRA_HEAVY
result-dir = results/t1s/prioplca/T1S_EXTRA_HEAVY_Std
[Config T1S_EXTRA_HEAVY_PrioTo]
extends = ExtraModes, PrioRadarTo, T1S_EXTRA_HEAVY
result-dir = results/t1s/prioplca/T1S_EXTRA_HEAVY_PrioTo

# multiTo: the radar owns every other slot on Z2/Z3.
#   3 nodes: 0 1 2 1 (4)   5 nodes: 0 1 2 1 3 1 4 (7)
#   8 nodes: 0 1 2 1 3 1 4 1 5 1 6 1 7 (13)
[Config ExtraMultiTo]
**.plca.typename = "PrioPlca"
*.Z1.ZSW.eth[*].plca.mode = "standard"
*.WINDOW1.eth[0].plca.mode = "standard"
*.X1[*].eth[0].plca.mode = "standard"
**.plca.mode = "multiTo"
*.plcaNodeCountZ2 = ${slots=4,7,13 ! extra}
*.plcaNodeCountZ3 = ${slots}
**.plca.slotOwners = ${owners="0 1 2 1","0 1 2 1 3 1 4","0 1 2 1 3 1 4 1 5 1 6 1 7" ! extra}
[Config T1S_EXTRA_SENSOR_MultiTo]
extends = ExtraModes, ExtraMultiTo, T1S_EXTRA_SENSOR
result-dir = results/t1s/prioplca/T1S_EXTRA_SENSOR_MultiTo
[Config T1S_EXTRA_HEAVY_MultiTo]
extends = ExtraModes, ExtraMultiTo, T1S_EXTRA_HEAVY
result-dir = results/t1s/prioplca/T1S_EXTRA_HEAVY_MultiTo

# Software fragmentation of the heavy nodes (as in plca-priority-to "Frag" /
# "Preempt"): the same ~1.2 Mb/s per node sent as 245 B payloads every
# 1.6667 ms (6 fragments per 10 ms) instead of 1472 B every 10 ms.
[Config HeavyFrag]
*.X*[*].app[0].source.packetLength = 245B
*.X*[*].app[0].source.productionInterval = 1666.667us
*.X*[*].app[0].source.initialProductionOffset = uniform(0ms, 1666.667us)
[Config T1S_EXTRA_HEAVYFRAG_Std]
extends = HeavyFrag, ExtraModes, PrioStd, T1S_EXTRA_HEAVY
result-dir = results/t1s/prioplca/T1S_EXTRA_HEAVYFRAG_Std
[Config T1S_EXTRA_HEAVYFRAG_PrioTo]
extends = HeavyFrag, ExtraModes, PrioRadarTo, T1S_EXTRA_HEAVY
result-dir = results/t1s/prioplca/T1S_EXTRA_HEAVYFRAG_PrioTo
