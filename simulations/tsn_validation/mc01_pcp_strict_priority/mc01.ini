[Config MC01Base]
description = "MC01 - PCP, traffic classes and egress contention"
network = Mc01PcpStrictPriority
sim-time-limit = 100ms
seed-set = 1

result-dir = ../../results/MC01/${configname}

# ----------------------------------------------------------------------
# Bitrates das interfaces Ethernet
# Devem corresponder aos datarates definidos nos canais do arquivo NED.
# ----------------------------------------------------------------------

# Enlaces sourceBe/sourceHp -> switch: 1 Gbps
*.sourceBe.eth[0].bitrate = 1Gbps
*.sourceHp.eth[0].bitrate = 1Gbps
*.switch.eth[0].bitrate = 1Gbps
*.switch.eth[1].bitrate = 1Gbps

# Enlace de gargalo switch -> receiver: 100 Mbps
*.switch.eth[2].bitrate = 100Mbps
*.receiver.eth[0].bitrate = 100Mbps

# ----------------------------------------------------------------------
# Aplicações emissoras
# ----------------------------------------------------------------------

*.source*.numApps = 1
*.source*.app[0].typename = "UdpSourceApp"
*.source*.app[0].io.destAddress = "receiver"

# Best effort: frame Ethernet total de aproximadamente 1500 B.
*.sourceBe.app[0].display-name = "best-effort"
*.sourceBe.app[0].io.destPort = 1000
*.sourceBe.app[0].source.packetNameFormat = "best-effort-%c"
*.sourceBe.app[0].source.packetLength = 1500B - 58B
*.sourceBe.app[0].source.productionInterval = 121us
*.sourceBe.app[0].source.initialProductionOffset = 1ms

# Alta prioridade: frame Ethernet total de aproximadamente 200 B.
*.sourceHp.app[0].display-name = "high-priority"
*.sourceHp.app[0].io.destPort = 1001
*.sourceHp.app[0].source.packetNameFormat = "high-priority-%c"
*.sourceHp.app[0].source.packetLength = 200B - 58B
*.sourceHp.app[0].source.productionInterval = 500us

# Faz o primeiro frame HP chegar enquanto um frame BE está sendo transmitido.
*.sourceHp.app[0].source.initialProductionOffset = 1.060ms

# ----------------------------------------------------------------------
# Receptor: uma aplicação por fluxo facilita separar os resultados
# ----------------------------------------------------------------------

*.receiver.numApps = 2
*.receiver.app[*].typename = "UdpSinkApp"

*.receiver.app[0].display-name = "best-effort-sink"
*.receiver.app[0].io.localPort = 1000

*.receiver.app[1].display-name = "high-priority-sink"
*.receiver.app[1].io.localPort = 1001

# ----------------------------------------------------------------------
# Identificação dos streams e codificação IEEE 802.1Q
# ----------------------------------------------------------------------

*.sourceBe.hasOutgoingStreams = true
*.sourceHp.hasOutgoingStreams = true

*.sourceBe.bridging.streamIdentifier.identifier.mapping = [{stream: "best-effort", packetFilter: expr(udp.destPort == 1000)}]
*.sourceHp.bridging.streamIdentifier.identifier.mapping = [{stream: "high-priority", packetFilter: expr(udp.destPort == 1001)}]

*.sourceBe.bridging.streamCoder.encoder.mapping = [{stream: "best-effort", vlan: 1, pcp: 0}]
*.sourceHp.bridging.streamCoder.encoder.mapping = [{stream: "high-priority", vlan: 1, pcp: 7}]

*.receiver.hasIncomingStreams = true
*.receiver.bridging.streamCoder.decoder.mapping = [{stream: "best-effort", vlan: 1, pcp: 0}, {stream: "high-priority", vlan: 1, pcp: 7}]

# ----------------------------------------------------------------------
# Resultados relevantes
# ----------------------------------------------------------------------

*.receiver.app[*].sink.packetLifeTime.result-recording-modes = vector,histogram

# Fila única da configuração FIFO ou fila composta do modo SP.
*.switch.eth[2].macLayer.queue.queueLength.result-recording-modes = vector,max,timeavg
*.switch.eth[2].macLayer.queue.queueingTime.result-recording-modes = vector,histogram

# Filas internas existentes no modo Strict Priority.
*.switch.eth[2].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,max,timeavg
*.switch.eth[2].macLayer.queue.queue[*].queueingTime.result-recording-modes = vector,histogram
*.switch.eth[2].macLayer.queue.queue[*].incomingPackets.result-recording-modes = count


[Config MC01Fifo]
extends = MC01Base
description = "MC01-A - tagged traffic using one FIFO egress queue"

*.switch.hasEgressTrafficShaping = false


[Config MC01StrictPriority]
extends = MC01Base
description = "MC01-B - PCP classification and two strict-priority traffic classes"

*.switch.hasEgressTrafficShaping = true

# Apenas duas classes: PCP 0-3 -> TC0; PCP 4-7 -> TC1.
*.switch.eth[*].macLayer.queue.numTrafficClasses = 2

# Sem schedule: todos os gates ficam permanentemente abertos.
*.switch.eth[*].macLayer.queue.transmissionGate[*].initiallyOpen = true
*.switch.eth[*].macLayer.queue.transmissionGate[*].durations = []

*.switch.eth[2].macLayer.queue.*[0].display-name = "TC0 - best effort"
*.switch.eth[2].macLayer.queue.*[1].display-name = "TC1 - high priority"


[Config MC01StrictPriority8Tc]
extends = MC01Base
description = "MC01-C - optional validation of the default eight-class mapping"

*.switch.hasEgressTrafficShaping = true
*.switch.eth[*].macLayer.queue.numTrafficClasses = 8
*.switch.eth[*].macLayer.queue.transmissionGate[*].initiallyOpen = true
*.switch.eth[*].macLayer.queue.transmissionGate[*].durations = []

# Com oito classes, PCP 0 mapeia para TC1 e PCP 7 para TC7.
*.switch.eth[2].macLayer.queue.*[1].display-name = "TC1 - PCP 0 best effort"
*.switch.eth[2].macLayer.queue.*[7].display-name = "TC5 - PCP 7 high priority"


[Config MC01Trace]
extends = MC01StrictPriority
description = "MC01 - short execution with event log for sequence inspection"

sim-time-limit = 1.3ms

record-eventlog = true
eventlog-recording-intervals = 0.999ms..1.250ms
eventlog-file = ${resultdir}/${configname}-${runnumber}.elog

