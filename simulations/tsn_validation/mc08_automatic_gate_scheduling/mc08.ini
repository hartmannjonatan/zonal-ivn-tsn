[General]

network = Mc08AutomaticGateScheduling

sim-time-limit = 20ms

result-dir = ../../results/MC08/${configname}

# O cenário é pequeno; mantemos todos os vectors necessários para validação.
**.scalar-recording = true
**.vector-recording = true

# TsnNetworkBase configura automaticamente as tabelas MAC.
**.arp.typename = "GlobalArp"

# ---------------------------------------------------------------------------
# Ethernet
# ---------------------------------------------------------------------------

# Os enlaces de ingresso são rápidos. O escalonamento relevante ocorre nos
# dois enlaces de 100 Mbit/s: switch1 -> switch2 -> receiver.

*.sourceCritical.eth[0].bitrate = 1Gbps
*.sourceBackground.eth[0].bitrate = 1Gbps

*.switch1.eth[0].bitrate = 1Gbps
*.switch1.eth[1].bitrate = 1Gbps
*.switch1.eth[2].bitrate = 100Mbps

*.switch2.eth[0].bitrate = 100Mbps
*.switch2.eth[1].bitrate = 100Mbps

*.receiver.eth[0].bitrate = 100Mbps

# ---------------------------------------------------------------------------
# Critical periodic stream
# ---------------------------------------------------------------------------

*.sourceCritical.numApps = 1

*.sourceCritical.app[0].typename = "UdpSourceApp"
*.sourceCritical.app[0].display-name = "critical source"

*.sourceCritical.app[0].io.destAddress = "receiver"
*.sourceCritical.app[0].io.destPort = 1000

*.sourceCritical.app[0].source.packetNameFormat = "critical-%c"
*.sourceCritical.app[0].source.packetLength = 500B
*.sourceCritical.app[0].source.productionInterval = 1ms

# Usado diretamente nas configurações Manual e AlwaysOpen.
# Os configuradores automáticos podem alterar este offset.
*.sourceCritical.app[0].source.initialProductionOffset = 1ms

# ---------------------------------------------------------------------------
# Background periodic stream
# ---------------------------------------------------------------------------

*.sourceBackground.numApps = 1

*.sourceBackground.app[0].typename = "UdpSourceApp"
*.sourceBackground.app[0].display-name = "background source"

*.sourceBackground.app[0].io.destAddress = "receiver"
*.sourceBackground.app[0].io.destPort = 1001

*.sourceBackground.app[0].source.packetNameFormat = "background-%c"
*.sourceBackground.app[0].source.packetLength = 1000B
*.sourceBackground.app[0].source.productionInterval = 1ms
*.sourceBackground.app[0].source.initialProductionOffset = 1ms

# ---------------------------------------------------------------------------
# Receiver
# ---------------------------------------------------------------------------

*.receiver.numApps = 2

*.receiver.app[*].typename = "UdpSinkApp"

*.receiver.app[0].display-name = "critical sink"
*.receiver.app[0].io.localPort = 1000

*.receiver.app[1].display-name = "background sink"
*.receiver.app[1].io.localPort = 1001

*.receiver.hasIncomingStreams = true

*.receiver.bridging.streamCoder.decoder.mapping = \
    [{pcp: 4, stream: "critical"}, \
     {pcp: 0, stream: "background"}]

# ---------------------------------------------------------------------------
# Stream identification and IEEE 802.1Q encoding
# ---------------------------------------------------------------------------

*.sourceCritical.hasOutgoingStreams = true
*.sourceBackground.hasOutgoingStreams = true

*.sourceCritical.bridging.streamIdentifier.identifier.mapping = \
    [{stream: "critical", \
      packetFilter: expr(has(udp) && udp.destPort == 1000)}]

*.sourceBackground.bridging.streamIdentifier.identifier.mapping = \
    [{stream: "background", \
      packetFilter: expr(has(udp) && udp.destPort == 1001)}]

*.sourceCritical.bridging.streamCoder.encoder.mapping = \
    [{stream: "critical", vlan: 1, pcp: 4}]

*.sourceBackground.bridging.streamCoder.encoder.mapping = \
    [{stream: "background", vlan: 1, pcp: 0}]

# Cada switch recupera o stream a partir do PCP e volta a codificá-lo
# quando o frame deixa o bridge.

*.switch*.hasIncomingStreams = true
*.switch*.hasOutgoingStreams = true

*.switch*.bridging.streamCoder.decoder.mapping = \
    [{pcp: 4, stream: "critical"}, \
     {pcp: 0, stream: "background"}]

*.switch*.bridging.streamCoder.encoder.mapping = \
    [{stream: "critical", vlan: 1, pcp: 4}, \
     {stream: "background", vlan: 1, pcp: 0}]

# ---------------------------------------------------------------------------
# Time-aware queues
# ---------------------------------------------------------------------------

*.switch*.hasEgressTrafficShaping = true

*.switch*.eth[*].macLayer.queue.numTrafficClasses = 2

*.switch*.eth[*].macLayer.queue.queue[0].display-name = \
    "TC0 - background"

*.switch*.eth[*].macLayer.queue.queue[1].display-name = \
    "TC1 - critical"

# ---------------------------------------------------------------------------
# Visualization
# ---------------------------------------------------------------------------

*.visualizer.gateScheduleVisualizer.displayGateSchedules = true
*.visualizer.gateScheduleVisualizer.displayDuration = 1ms

*.visualizer.gateScheduleVisualizer.gateFilter = \
    "*.switch1.eth[2].**.transmissionGate[*] or \
     *.switch2.eth[1].**.transmissionGate[*]"

*.visualizer.gateScheduleVisualizer.height = 20

# ===========================================================================
# Always-open baseline
# ===========================================================================

[Config MC08AlwaysOpen]

description = "All gates remain open: baseline with Strict Priority, not TAS"

*.gateScheduleConfigurator.typename = \
    "AlwaysOpenGateScheduleConfigurator"

*.gateScheduleConfigurator.gateCycleDuration = 1ms

*.gateScheduleConfigurator.configuration = \
    [{name: "critical", type: "unicast", \
      pcp: 4, gateIndex: 1, application: "app[0]", \
      source: "sourceCritical", destination: "receiver", \
      packetLength: 500B + 58B, packetInterval: 1ms, \
      maxLatency: 400us, maxJitter: 50us}, \
     {name: "background", type: "unicast", \
      pcp: 0, gateIndex: 0, application: "app[0]", \
      source: "sourceBackground", destination: "receiver", \
      packetLength: 1000B + 58B, packetInterval: 1ms, \
      maxLatency: 800us, maxJitter: 50us}]

# ===========================================================================
# Manual gate schedule
# ===========================================================================

[Config MC08Manual]

description = "Feasible manually configured GCL over two switches"

*.gateScheduleConfigurator.typename = ""

# ---------------------------------------------------------------------------
# Configurações específicas — devem aparecer antes do fallback genérico
# ---------------------------------------------------------------------------

# switch1.eth[2]
# TC1: aberta de 0 a 80 us
*.switch1.eth[2].macLayer.queue.transmissionGate[1].initiallyOpen = true
*.switch1.eth[2].macLayer.queue.transmissionGate[1].durations = \
    [80us, 920us]
*.switch1.eth[2].macLayer.queue.transmissionGate[1].offset = 0us

# TC0: fechada até 100 us, aberta de 100 a 220 us
*.switch1.eth[2].macLayer.queue.transmissionGate[0].initiallyOpen = false
*.switch1.eth[2].macLayer.queue.transmissionGate[0].durations = \
    [880us, 120us]
*.switch1.eth[2].macLayer.queue.transmissionGate[0].offset = 780us

# switch2.eth[1]
# TC1: fechada até 60 us, aberta de 60 a 140 us
*.switch2.eth[1].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.switch2.eth[1].macLayer.queue.transmissionGate[1].durations = \
    [920us, 80us]
*.switch2.eth[1].macLayer.queue.transmissionGate[1].offset = 860us

# TC0: fechada até 200 us, aberta de 200 a 320 us
*.switch2.eth[1].macLayer.queue.transmissionGate[0].initiallyOpen = false
*.switch2.eth[1].macLayer.queue.transmissionGate[0].durations = \
    [880us, 120us]
*.switch2.eth[1].macLayer.queue.transmissionGate[0].offset = 680us

# ---------------------------------------------------------------------------
# Fallback — interfaces não pertencentes ao caminho validado
# Deve permanecer depois das configurações específicas.
# ---------------------------------------------------------------------------

*.switch*.eth[*].macLayer.queue.transmissionGate[*].initiallyOpen = true
*.switch*.eth[*].macLayer.queue.transmissionGate[*].durations = []
*.switch*.eth[*].macLayer.queue.transmissionGate[*].offset = 0s

[Config MC08AutomaticBase]

abstract = true

*.gateScheduleConfigurator.gateCycleDuration = 1ms

# 58 B =
#   8 B UDP
# + 20 B IPv4
# + 4 B IEEE 802.1Q C-tag
# + 14 B Ethernet MAC header
# + 4 B Ethernet FCS
# + 8 B Ethernet PHY header
#
# O configurador recebe requisitos dos fluxos, não uma GCL pronta.

*.gateScheduleConfigurator.configuration = \
    [{name: "critical", \
      pcp: 4, gateIndex: 1, application: "app[0]", \
      source: "sourceCritical", destination: "receiver", \
      packetLength: 500B + 58B, packetInterval: 1ms, \
      maxLatency: 400us, maxJitter: 50us}, \
     {name: "background", \
      pcp: 0, gateIndex: 0, application: "app[0]", \
      source: "sourceBackground", destination: "receiver", \
      packetLength: 1000B + 58B, packetInterval: 1ms, \
      maxLatency: 800us, maxJitter: 50us}]

# ===========================================================================
# Eager automatic scheduling
# ===========================================================================

[Config MC08Eager]

extends = MC08AutomaticBase

description = "Automatic GCL generation with the Eager configurator"

*.gateScheduleConfigurator.typename = \
    "EagerGateScheduleConfigurator"

# ===========================================================================
# Z3 automatic scheduling
# ===========================================================================

[Config MC08Z3]

extends = MC08AutomaticBase

description = "Automatic GCL generation using the Z3 constraint solver"

*.gateScheduleConfigurator.typename = \
    "inet.linklayer.configurator.gatescheduling.z3.Z3GateScheduleConfigurator"

# Procura uma solução que também minimize o atraso fim a fim total.
*.gateScheduleConfigurator.optimizeSchedule = true

# ===========================================================================
# Intentionally infeasible requirement set
# ===========================================================================

[Config MC08EagerInfeasible]

extends = MC08AutomaticBase

description = "Infeasible schedule: declared periodic load exceeds 100 Mbps"

*.gateScheduleConfigurator.typename = \
    "EagerGateScheduleConfigurator"

*.sourceCritical.app[0].source.productionInterval = 100us
*.sourceBackground.app[0].source.productionInterval = 100us

*.gateScheduleConfigurator.configuration = \
    [{name: "critical", \
      pcp: 4, gateIndex: 1, application: "app[0]", \
      source: "sourceCritical", destination: "receiver", \
      packetLength: 500B + 58B, packetInterval: 100us, \
      maxLatency: 1ms, maxJitter: 50us}, \
     {name: "background", \
      pcp: 0, gateIndex: 0, application: "app[0]", \
      source: "sourceBackground", destination: "receiver", \
      packetLength: 1000B + 58B, packetInterval: 100us, \
      maxLatency: 1ms, maxJitter: 50us}]