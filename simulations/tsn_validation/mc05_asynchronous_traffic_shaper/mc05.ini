[General]
network = Mc05AsynchronousTrafficShaper
sim-time-limit = 50ms
result-dir = ../../results/MC05/${configname}

# O cenário é pequeno; mantemos todos os vectors necessários para a validação.
**.scalar-recording = true
**.vector-recording = true

# ---------------------------------------------------------------------------
# Ethernet
# ---------------------------------------------------------------------------

*.source*.eth[0].bitrate = 1Gbps
*.switch.eth[0].bitrate = 1Gbps
*.switch.eth[1].bitrate = 1Gbps

*.switch.eth[2].bitrate = 100Mbps
*.receiver.eth[0].bitrate = 100Mbps

# ---------------------------------------------------------------------------
# Traffic generation
# ---------------------------------------------------------------------------

*.sourceReference.numApps = 1
*.sourceReference.app[0].typename = "UdpBasicBurst"
*.sourceReference.app[0].destAddresses = "receiver"
*.sourceReference.app[0].chooseDestAddrMode = "once"
*.sourceReference.app[0].destPort = 1000
*.sourceReference.app[0].messageLength = 1000B
*.sourceReference.app[0].startTime = 1ms
*.sourceReference.app[0].stopTime = 49ms

# Two packets per approximately 1 ms cycle: about 16 Mbit/s payload.
*.sourceReference.app[0].burstDuration = 101us
*.sourceReference.app[0].sendInterval = 100us
*.sourceReference.app[0].sleepDuration = 899us

*.sourceAggressive.numApps = 1
*.sourceAggressive.app[0].typename = "UdpBasicBurst"
*.sourceAggressive.app[0].destAddresses = "receiver"
*.sourceAggressive.app[0].chooseDestAddrMode = "once"
*.sourceAggressive.app[0].destPort = 1001
*.sourceAggressive.app[0].messageLength = 1000B
*.sourceAggressive.app[0].startTime = 1ms
*.sourceAggressive.app[0].stopTime = 49ms

# Five packets per approximately 1 ms cycle: about 40 Mbit/s payload.
*.sourceAggressive.app[0].burstDuration = 161us
*.sourceAggressive.app[0].sendInterval = 40us
*.sourceAggressive.app[0].sleepDuration = 839us

# ---------------------------------------------------------------------------
# Receiver
# ---------------------------------------------------------------------------

*.receiver.numApps = 2
*.receiver.app[*].typename = "UdpSinkApp"

*.receiver.app[0].display-name = "reference sink"
*.receiver.app[0].io.localPort = 1000

*.receiver.app[1].display-name = "aggressive sink"
*.receiver.app[1].io.localPort = 1001

# ---------------------------------------------------------------------------
# Stream identification and IEEE 802.1Q encoding
# ---------------------------------------------------------------------------

*.sourceReference.hasOutgoingStreams = true
*.sourceAggressive.hasOutgoingStreams = true

*.sourceReference.bridging.streamIdentifier.identifier.mapping = [{stream: "reference", packetFilter: expr(has(udp) && udp.destPort == 1000)}]

*.sourceAggressive.bridging.streamIdentifier.identifier.mapping = [{stream: "aggressive", packetFilter: expr(has(udp) && udp.destPort == 1001)}]

*.sourceReference.bridging.streamCoder.encoder.mapping = [{stream: "reference", vlan: 1, pcp: 4}]

*.sourceAggressive.bridging.streamCoder.encoder.mapping = [{stream: "aggressive", vlan: 1, pcp: 5}]

# Recover the stream name at the switch ingress.
*.switch.hasIncomingStreams = true
*.switch.bridging.streamCoder.decoder.mapping = [{pcp: 4, stream: "reference"},{pcp: 5, stream: "aggressive"}]

# The receiver does not process an IEEE 802.1Q C-tag.
*.switch.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]

# ---------------------------------------------------------------------------
# Common output queue configuration
# ---------------------------------------------------------------------------

# Needed in all experiments so ATS-off and ATS-on use the same TC structure.
*.switch.hasEgressTrafficShaping = true
*.switch.eth[*].macLayer.queue.numTrafficClasses = 2

*.switch.eth[*].macLayer.queue.*[0].display-name = "TC0"
*.switch.eth[*].macLayer.queue.*[1].display-name = "TC1 - shared ATS"

# With two traffic classes, the standard PCP mapping puts PCP 4 and PCP 5
# in TC1. Thus, the streams remain distinct at ingress but share TC1 at egress.

# ===========================================================================
# ATS disabled
# ===========================================================================

[Config MC05NoAts]
description = "ATS disabled: bursty streams share an ordinary TC1 queue"

*.switch.hasIngressTrafficFiltering = false

# ===========================================================================
# Base ATS configuration
# ===========================================================================

[Config MC05AtsBase]
description = "Per-stream ATS: aggressive CIR 10.46 Mbps, CBS two packets"

# Ingress per-stream processing
*.switch.hasIngressTrafficFiltering = true

*.switch.bridging.streamFilter.ingress.numStreams = 2
*.switch.bridging.streamFilter.ingress.classifier.mapping = {"reference": 0,"aggressive": 1}

*.switch.bridging.streamFilter.ingress.*[0].display-name = "reference"
*.switch.bridging.streamFilter.ingress.*[1].display-name = "aggressive"

*.switch.bridging.streamFilter.ingress.meter[*].typename = "EligibilityTimeMeter"
*.switch.bridging.streamFilter.ingress.filter[*].typename = "EligibilityTimeFilter"

# Includes Ethernet MAC header and FCS in the rate calculation.
*.switch.bridging.streamFilter.ingress.meter[*].packetOverheadLength = 18B

# Reference: offered load is below this CIR.
*.switch.bridging.streamFilter.ingress.meter[0].committedInformationRate = 20.92Mbps
*.switch.bridging.streamFilter.ingress.meter[0].committedBurstSize = \
    2 * (1000B + 28B + 18B)

# Aggressive: offered load is substantially above this CIR.
*.switch.bridging.streamFilter.ingress.meter[1].committedInformationRate = 10.46Mbps
*.switch.bridging.streamFilter.ingress.meter[1].committedBurstSize = \
    2 * (1000B + 28B + 18B)

# No residence-time drop in the base experiment.
*.switch.bridging.streamFilter.ingress.meter[*].maxResidenceTime = -1s
*.switch.bridging.streamFilter.ingress.filter[*].maxResidenceTime = -1s

# Egress ATS. Both streams enter the same TC1 queue.
*.switch.eth[*].macLayer.queue.queue[1].typename = "EligibilityTimeQueue"
*.switch.eth[*].macLayer.queue.transmissionSelectionAlgorithm[1].typename = \
    "EligibilityTimeGate"

# ===========================================================================
# CIR variation
# ===========================================================================

[Config MC05AtsHighCir]
extends = MC05AtsBase
description = "Aggressive-stream CIR increased from 10.46 to 20.92 Mbps"

*.switch.bridging.streamFilter.ingress.meter[1].committedInformationRate = 20.92Mbps

# ===========================================================================
# Committed burst size variation
# ===========================================================================

[Config MC05AtsLargeBurst]
extends = MC05AtsBase
description = "Aggressive stream may release a larger initial burst"

*.switch.bridging.streamFilter.ingress.meter[1].committedBurstSize = \
    8 * (1000B + 28B + 18B)

# ===========================================================================
# Maximum residence-time variation
# ===========================================================================

[Config MC05AtsResidence2ms]
extends = MC05AtsBase
description = "Aggressive packets requiring over 2 ms eligibility delay are dropped"

# The limit is changed only for the aggressive flow to verify isolation.
*.switch.bridging.streamFilter.ingress.meter[1].maxResidenceTime = 2ms
*.switch.bridging.streamFilter.ingress.filter[1].maxResidenceTime = 2ms

