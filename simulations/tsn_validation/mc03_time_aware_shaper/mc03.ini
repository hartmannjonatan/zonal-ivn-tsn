[General]

# directly or inspected from simulations/omnetpp.ini.
network = Mc03TimeAwareShaper

sim-time-limit = 20ms
result-dir = ../../results/MC03/${configname}
record-eventlog = false

# ---------------------------------------------------------------------------
# Ethernet interface bitrates
# ---------------------------------------------------------------------------

*.sourceBe.eth[0].bitrate = 1Gbps
*.sourceScheduled.eth[0].bitrate = 1Gbps

*.switch.eth[0].bitrate = 1Gbps
*.switch.eth[1].bitrate = 1Gbps
*.switch.eth[2].bitrate = 100Mbps

*.receiver.eth[0].bitrate = 100Mbps

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------

# Best-effort source.
# 1442 B payload + approximately 58 B of protocol/PHY overhead produces
# a frame of approximately 1500 B, requiring about 120 us at 100 Mbit/s.
*.sourceBe.numApps = 1
*.sourceBe.app[0].typename = "UdpSourceApp"
*.sourceBe.app[0].display-name = "best-effort"
*.sourceBe.app[0].io.destAddress = "receiver"
*.sourceBe.app[0].io.destPort = 1000
*.sourceBe.app[0].source.packetLength = 1500B - 58B
*.sourceBe.app[0].source.productionInterval = 150us
*.sourceBe.app[0].source.initialProductionOffset = 1ms

# Scheduled traffic.
# The complete frame is approximately 200 B and requires about 16 us
# on the 100 Mbit/s output link.
*.sourceScheduled.numApps = 1
*.sourceScheduled.app[0].typename = "UdpSourceApp"
*.sourceScheduled.app[0].display-name = "scheduled"
*.sourceScheduled.app[0].io.destAddress = "receiver"
*.sourceScheduled.app[0].io.destPort = 1001
*.sourceScheduled.app[0].source.packetLength = 200B - 58B
*.sourceScheduled.app[0].source.productionInterval = 1ms
*.sourceScheduled.app[0].source.initialProductionOffset = 1ms

# Destination applications.
*.receiver.numApps = 2
*.receiver.app[*].typename = "UdpSinkApp"

*.receiver.app[0].display-name = "best-effort-sink"
*.receiver.app[0].io.localPort = 1000

*.receiver.app[1].display-name = "scheduled-sink"
*.receiver.app[1].io.localPort = 1001

# ---------------------------------------------------------------------------
# Stream identification and IEEE 802.1Q encoding
# ---------------------------------------------------------------------------

*.sourceBe.hasOutgoingStreams = true
*.sourceScheduled.hasOutgoingStreams = true

# Keep expressions on one line and test has(udp) before accessing destPort.
*.sourceBe.bridging.streamIdentifier.identifier.mapping = [{stream: "best-effort", packetFilter: expr(has(udp) && udp.destPort == 1000)}]
*.sourceScheduled.bridging.streamIdentifier.identifier.mapping = [{stream: "scheduled", packetFilter: expr(has(udp) && udp.destPort == 1001)}]

# With two traffic classes, PCP 0 is classified into TC0 and PCP 5 into TC1.
*.sourceBe.bridging.streamCoder.encoder.mapping = [{stream: "best-effort", vlan: 1, pcp: 0}]
*.sourceScheduled.bridging.streamCoder.encoder.mapping = [{stream: "scheduled", vlan: 1, pcp: 5}]

# ---------------------------------------------------------------------------
# Switch egress queues
# ---------------------------------------------------------------------------

# Installs Ieee8021qTimeAwareShaper on the switch Ethernet interfaces.
# Without gate durations, all transmission gates remain permanently open.
*.switch.hasEgressTrafficShaping = true

# eth[2] is the only interface where both streams compete.
*.switch.eth[2].macLayer.queue.numTrafficClasses = 2

*.switch.eth[2].macLayer.queue.*[0].display-name = "TC0 - best effort"
*.switch.eth[2].macLayer.queue.*[1].display-name = "TC1 - scheduled"

# Remove the C-TAG before delivering frames to the receiver.
# Tagged frames can still be inspected at the sources and inside the switch.
*.switch.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]

# ---------------------------------------------------------------------------
# Gate schedule visualization
# ---------------------------------------------------------------------------

*.visualizer.gateScheduleVisualizer.displayGateSchedules = true
*.visualizer.gateScheduleVisualizer.displayDuration = 2ms
*.visualizer.gateScheduleVisualizer.gateFilter = "*.switch.eth[2].**"
*.visualizer.gateScheduleVisualizer.height = 16

# ---------------------------------------------------------------------------
# Relevant results
# ---------------------------------------------------------------------------

# Gate state: 1/open and 0/closed, recorded as sample-hold vectors.
*.switch.eth[2].macLayer.queue.transmissionGate[*].gateState.result-recording-modes = vector

# Indicates the interval in which the gate is logically open but a frame
# no longer fits completely before the closing instant.
*.switch.eth[2].macLayer.queue.transmissionGate[*].guardBandState.result-recording-modes = vector

# Queue occupancy and waiting time for each traffic class.
*.switch.eth[2].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,last,max,timeavg
*.switch.eth[2].macLayer.queue.queue[*].queueingTime.result-recording-modes = vector,histogram

# outgoingPacketLengths provides the instants at which packets leave each queue.
*.switch.eth[2].macLayer.queue.queue[*].outgoingPacketLengths.result-recording-modes = vector,sum
*.switch.eth[2].macLayer.queue.queue[*].outgoingDataRate.result-recording-modes = vector
*.switch.eth[2].macLayer.queue.queue[*].incomingPackets.result-recording-modes = count
*.switch.eth[2].macLayer.queue.queue[*].outgoingPackets.result-recording-modes = count

# End-to-end result for each application stream.
*.receiver.app[*].sink.packetLifeTime.result-recording-modes = vector,histogram


# ===========================================================================
# Configurations
# ===========================================================================

[Config MC03OpenGates]

description = "Two traffic classes with Strict Priority and permanently open gates"

# No durations are assigned. Both gates therefore remain open and the
# PriorityScheduler always selects TC1 when both queues are eligible.


[Config MC03TasManual]

description = "Manual TAS with a 1 ms cycle: TC1=100 us and TC0=900 us"

extends = MC03OpenGates

# Cycle:
#   0 us .. 100 us    -> TC1 open, TC0 closed
#   100 us .. 1000 us -> TC1 closed, TC0 open
#
# The sum of durations is the 1 ms gate cycle.
*.switch.eth[2].macLayer.queue.transmissionGate[0].initiallyOpen = false
*.switch.eth[2].macLayer.queue.transmissionGate[0].durations = [100us, 900us]

*.switch.eth[2].macLayer.queue.transmissionGate[1].initiallyOpen = true
*.switch.eth[2].macLayer.queue.transmissionGate[1].durations = [100us, 900us]


[Config MC03TasWideWindow]

description = "Manual TAS with a wider 200 us TC1 window and the same 1 ms cycle"

extends = MC03TasManual

# Changes window duration without changing the complete cycle.
*.switch.eth[2].macLayer.queue.transmissionGate[0].durations = [200us, 800us]
*.switch.eth[2].macLayer.queue.transmissionGate[1].durations = [200us, 800us]


[Config MC03TasOffset250]

description = "Manual TAS with the 1 ms schedule shifted by a 250 us offset"

extends = MC03TasManual

# Both gates receive the same offset to preserve their complementary relation.
*.switch.eth[2].macLayer.queue.transmissionGate[0].offset = 250us
*.switch.eth[2].macLayer.queue.transmissionGate[1].offset = 250us


[Config MC03TasCycle2ms]

description = "Manual TAS with a 2 ms cycle and a 200 us TC1 window"

extends = MC03TasManual

*.switch.eth[2].macLayer.queue.transmissionGate[0].durations = [200us, 1800us]
*.switch.eth[2].macLayer.queue.transmissionGate[1].durations = [200us, 1800us]

# Keep scheduled packet production aligned with the new cycle.
*.sourceScheduled.app[0].source.productionInterval = 2ms
*.sourceScheduled.app[0].source.initialProductionOffset = 2ms


[Config MC03TasLateArrival]

description = "Scheduled frame arrives just after the TC1 window closes"

extends = MC03TasManual

# TC1 closes at 1.1 ms. The packet is produced at 1.11 ms and reaches
# the switch shortly afterwards, so it should wait for the 2 ms opening.
*.sourceScheduled.app[0].source.initialProductionOffset = 1.11ms


[Config MC03TasNoGuardBand]

description = "Manual TAS with the TC0 implicit guard band disabled"

extends = MC03TasManual

# Diagnostic configuration: a BE frame may start near the end of its window
# and finish after TC1 has opened. The transmission remains non-preemptive.
*.switch.eth[2].macLayer.queue.transmissionGate[0].enableImplicitGuardBand = false

