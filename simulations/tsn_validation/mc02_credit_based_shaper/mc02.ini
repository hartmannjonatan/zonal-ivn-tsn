[General]
network = Mc02CreditBasedShaper
sim-time-limit = 200ms

# The file is intended to be executed directly from this directory.
result-dir = ../../results/MC02/${configname}

# Event logs are unnecessary for this validation and can become very large.
record-eventlog = false

# Data rate
*.sourceBe.eth[0].bitrate = 1Gbps
*.sourceShaped.eth[0].bitrate = 1Gbps
*.switch.eth[0].bitrate = 1Gbps
*.switch.eth[1].bitrate = 1Gbps

*.switch.eth[2].bitrate = 100Mbps
*.receiver.eth[0].bitrate = 100Mbps

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------

*.sourceBe.numApps = 1
*.sourceBe.app[0].typename = "UdpSourceApp"
*.sourceBe.app[0].display-name = "best-effort"
*.sourceBe.app[0].io.destAddress = "receiver"
*.sourceBe.app[0].io.destPort = 1000
*.sourceBe.app[0].source.packetLength = 1000B

# 1000 B every 80 us = 100 Mbit/s of application payload.
# This keeps the BE queue backlogged at the 100 Mbit/s bottleneck.
*.sourceBe.app[0].source.productionInterval = 80us
*.sourceBe.app[0].source.initialProductionOffset = 1ms

*.sourceShaped.numApps = 1
*.sourceShaped.app[0].typename = "UdpSourceApp"
*.sourceShaped.app[0].display-name = "shaped"
*.sourceShaped.app[0].io.destAddress = "receiver"
*.sourceShaped.app[0].io.destPort = 1001
*.sourceShaped.app[0].source.packetLength = 1000B

# 1000 B every 100 us = 80 Mbit/s of application payload.
# This is above all tested idleSlope values: 20, 40 and 60 Mbit/s.
*.sourceShaped.app[0].source.productionInterval = 100us
*.sourceShaped.app[0].source.initialProductionOffset = 1.04ms

*.receiver.numApps = 2
*.receiver.app[*].typename = "UdpSinkApp"

*.receiver.app[0].display-name = "best-effort-sink"
*.receiver.app[0].io.localPort = 1000

*.receiver.app[1].display-name = "shaped-sink"
*.receiver.app[1].io.localPort = 1001

# ---------------------------------------------------------------------------
# Stream identification and IEEE 802.1Q encoding
# ---------------------------------------------------------------------------

*.sourceBe.hasOutgoingStreams = true
*.sourceShaped.hasOutgoingStreams = true

# Keep mappings on one line to avoid multiline INI expression errors.
*.sourceBe.bridging.streamIdentifier.identifier.mapping = [{stream: "best-effort", packetFilter: expr(has(udp) && udp.destPort == 1000)}]
*.sourceShaped.bridging.streamIdentifier.identifier.mapping = [{stream: "shaped", packetFilter: expr(has(udp) &&  udp.destPort == 1001)}]

# With two traffic classes, PCP 0 is mapped to TC0 and PCP 5 to TC1.
*.sourceBe.bridging.streamCoder.encoder.mapping = [{stream: "best-effort", vlan: 1, pcp: 0}]
*.sourceShaped.bridging.streamCoder.encoder.mapping = [{stream: "shaped", vlan: 1, pcp: 5}]

# ---------------------------------------------------------------------------
# Switch output queues
# ---------------------------------------------------------------------------

# Installs Ieee8021qTimeAwareShaper on the Ethernet interfaces.
# Its periodic gates remain open, so TAS is not being tested here.
*.switch.hasEgressTrafficShaping = true

# eth[2] is the switch-to-receiver bottleneck.
*.switch.eth[2].macLayer.queue.numTrafficClasses = 2
*.switch.eth[2].macLayer.queue.*[0].display-name = "TC0 - best effort"
*.switch.eth[2].macLayer.queue.*[1].display-name = "TC1 - shaped"

# Remove the C-Tag before delivering the frames to the receiver.
# The tagged frames can still be inspected inside the switch.
*.switch.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]

# ---------------------------------------------------------------------------
# Relevant result recording
# ---------------------------------------------------------------------------

*.switch.eth[2].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,last,max,timeavg
*.switch.eth[2].macLayer.queue.queue[*].queueingTime.result-recording-modes = vector,histogram
*.switch.eth[2].macLayer.queue.queue[*].incomingDataRate.result-recording-modes = vector
*.switch.eth[2].macLayer.queue.queue[*].outgoingDataRate.result-recording-modes = vector
*.switch.eth[2].macLayer.queue.queue[*].incomingPackets.result-recording-modes = count
*.switch.eth[2].macLayer.queue.queue[*].outgoingPackets.result-recording-modes = count

*.receiver.app[*].sink.packetLifeTime.result-recording-modes = vector,histogram

# ===========================================================================
# Configurations
# ===========================================================================

[Config MC02NoCbs]
description = "Two traffic classes with Strict Priority, without CBS"

# The default transmission-selection gates remain open.
# TC1 therefore has strict priority over TC0 without rate limitation.


[Config MC02Cbs40]
description = "CBS on TC1 with idleSlope = 40 Mbit/s"
extends = MC02NoCbs

# Replace only the TC1 transmission-selection gate with CBS.
*.switch.eth[2].macLayer.queue.transmissionSelectionAlgorithm[1].typename = "Ieee8021qCreditBasedShaper"
*.switch.eth[2].macLayer.queue.transmissionSelectionAlgorithm[1].idleSlope = 40Mbps

# sendSlope is deliberately not configured:
# INET calculates it as idleSlope - interface bitrate.


[Config MC02Cbs20]
description = "CBS on TC1 with idleSlope = 20 Mbit/s"
extends = MC02Cbs40

*.switch.eth[2].macLayer.queue.transmissionSelectionAlgorithm[1].idleSlope = 20Mbps


[Config MC02Cbs60]
description = "CBS on TC1 with idleSlope = 60 Mbit/s"
extends = MC02Cbs40

*.switch.eth[2].macLayer.queue.transmissionSelectionAlgorithm[1].idleSlope = 60Mbps


[Config MC02Cbs40Sparse]
description = "CBS at 40 Mbit/s with offered load below idleSlope"
extends = MC02Cbs40

# 1000 B every 1 ms = 8 Mbit/s of application payload.
# TC1 should become empty between packets, exposing the empty-queue rule.
*.sourceShaped.app[0].source.productionInterval = 1ms

