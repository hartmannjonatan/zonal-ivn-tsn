[General]
network = Mc06PerStreamFilteringPolicing
sim-time-limit = 50ms
result-dir = ../../results/MC06/${configname}

# The scenario is intentionally small; keep the vectors required for validation.
**.scalar-recording = true
**.vector-recording = true

# ---------------------------------------------------------------------------
# Ethernet
# ---------------------------------------------------------------------------

*.source*.eth[0].bitrate = 1Gbps
*.switch.eth[0].bitrate = 1Gbps
*.switch.eth[1].bitrate = 1Gbps
*.switch.eth[2].bitrate = 100Mbps
*.receiver.eth[0].bitrate = 100Mbps

# ---------------------------------------------------------------------------
# Traffic generation
# ---------------------------------------------------------------------------

*.sourceHealthy.numApps = 1
*.sourceHealthy.app[0].typename = "UdpBasicBurst"
*.sourceHealthy.app[0].destAddresses = "receiver"
*.sourceHealthy.app[0].chooseDestAddrMode = "once"
*.sourceHealthy.app[0].destPort = 1000
*.sourceHealthy.app[0].messageLength = 1000B
*.sourceHealthy.app[0].startTime = 1ms
*.sourceHealthy.app[0].stopTime = 49ms
*.sourceHealthy.app[0].burstDuration = 1s
*.sourceHealthy.app[0].sendInterval = 400us
*.sourceHealthy.app[0].sleepDuration = 1s

# 1000 B every 400 us: 20 Mbit/s payload (about 20.92 Mbit/s including
# UDP, IPv4, Ethernet MAC header and FCS).

*.sourceMonitored.numApps = 1
*.sourceMonitored.app[0].typename = "UdpBasicBurst"
*.sourceMonitored.app[0].destAddresses = "receiver"
*.sourceMonitored.app[0].chooseDestAddrMode = "once"
*.sourceMonitored.app[0].destPort = 1001
*.sourceMonitored.app[0].messageLength = 1000B
*.sourceMonitored.app[0].startTime = 1ms
*.sourceMonitored.app[0].stopTime = 49ms
*.sourceMonitored.app[0].burstDuration = 1s
*.sourceMonitored.app[0].sleepDuration = 1s

# The compliant interval is slightly above 200 us so the complete Ethernet
# frame stays below the 40 Mbit/s contract. Faulty configurations override it.
*.sourceMonitored.app[0].sendInterval = 210us

# ---------------------------------------------------------------------------
# Receiver
# ---------------------------------------------------------------------------

*.receiver.numApps = 2
*.receiver.app[*].typename = "UdpSinkApp"
*.receiver.app[0].display-name = "healthy sink"
*.receiver.app[0].io.localPort = 1000
*.receiver.app[1].display-name = "monitored sink"
*.receiver.app[1].io.localPort = 1001

# ---------------------------------------------------------------------------
# Stream identification and IEEE 802.1Q encoding
# ---------------------------------------------------------------------------

*.sourceHealthy.hasOutgoingStreams = true
*.sourceMonitored.hasOutgoingStreams = true

*.sourceHealthy.bridging.streamIdentifier.identifier.mapping = [{stream: "healthy", packetFilter: expr(has(udp) && udp.destPort == 1000)}]
*.sourceMonitored.bridging.streamIdentifier.identifier.mapping = [{stream: "monitored", packetFilter: expr(has(udp) && udp.destPort == 1001)}]

*.sourceHealthy.bridging.streamCoder.encoder.mapping = [{stream: "healthy", vlan: 1, pcp: 4}]
*.sourceMonitored.bridging.streamCoder.encoder.mapping = [{stream: "monitored", vlan: 1, pcp: 5}]

# The switch reconstructs the stream name before the ingress PSFP classifier.
*.switch.hasIncomingStreams = true
*.switch.bridging.streamCoder.decoder.mapping = [{pcp: 4, stream: "healthy"},{pcp: 5, stream: "monitored"}]

# The receiver does not process an IEEE 802.1Q C-tag.
*.switch.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]

# ---------------------------------------------------------------------------
# Common output queue
# ---------------------------------------------------------------------------

# Both PCP 4 and PCP 5 map to TC1 when two traffic classes are used. Thus, the
# streams share the same 100 Mbit/s output queue and differ only in PSFP policy.
*.switch.hasEgressTrafficShaping = true
*.switch.eth[*].macLayer.queue.numTrafficClasses = 2
*.switch.eth[*].macLayer.queue.*[0].display-name = "TC0"
*.switch.eth[*].macLayer.queue.*[1].display-name = "TC1 - shared"

# ===========================================================================
# Excessive source without PSFP
# ===========================================================================

[Config MC06NoPsfp]
description = "Faulty source exceeds the shared output link and PSFP is disabled"

*.switch.hasIngressTrafficFiltering = false

# About 133.33 Mbit/s payload, intentionally above the 100 Mbit/s bottleneck.
*.sourceMonitored.app[0].sendInterval = 60us

# ===========================================================================
# PSFP with both sources compliant
# ===========================================================================

[Config MC06PsfpHealthy]
description = "PSFP enabled and both streams remain within their contracts"

*.switch.hasIngressTrafficFiltering = true
*.switch.bridging.streamFilter.ingress.numStreams = 2

# There are exactly two data streams and GlobalArp is provided by TsnNetworkBase.
# Rejecting the default path also makes a missing stream-decoder mapping visible.
*.switch.bridging.streamFilter.ingress.hasDefaultPath = false
*.switch.bridging.streamFilter.ingress.classifier.mapping = {"healthy": 0,"monitored": 1}

*.switch.bridging.streamFilter.ingress.*[0].display-name = "healthy"
*.switch.bridging.streamFilter.ingress.*[1].display-name = "monitored"

# SimpleIeee8021qFilter internally uses:
# classifier -> gateFilter -> gate -> meter -> filter -> multiplexer.
# Gates are deliberately kept open so this micro-scenario isolates policing.
*.switch.bridging.streamFilter.ingress.gate[*].typename = "InteractiveGate"
*.switch.bridging.streamFilter.ingress.gate[*].open = true

# A single-rate two-color meter attaches either "green" or "red".
# LabelFilter forwards only green packets and immediately drops red packets.
*.switch.bridging.streamFilter.ingress.meter[*].typename = "SingleRateTwoColorMeter"
*.switch.bridging.streamFilter.ingress.filter[*].typename = "LabelFilter"
*.switch.bridging.streamFilter.ingress.filter[*].labelFilter = "green"

# The meter consumes the full packet length visible in the bridging layer.
*.switch.bridging.streamFilter.ingress.meter[0].committedInformationRate = 21Mbps
*.switch.bridging.streamFilter.ingress.meter[0].committedBurstSize = \
    5 * (1000B + 28B + 18B)

*.switch.bridging.streamFilter.ingress.meter[1].committedInformationRate = 40Mbps
*.switch.bridging.streamFilter.ingress.meter[1].committedBurstSize = \
    5 * (1000B + 28B + 18B)

# ===========================================================================
# PSFP with a faulty/excessive source
# ===========================================================================

[Config MC06PsfpFaulty]
extends = MC06PsfpHealthy
description = "PSFP contains an excessive monitored stream and protects the healthy stream"

# Same failure offered in MC06NoPsfp, now subject to the 40 Mbit/s contract.
*.sourceMonitored.app[0].sendInterval = 60us
