[General]

network = Mc04ClockDriftGptpTas
sim-time-limit = 2s
simtime-resolution = fs
seed-set = 42

# The file is intended to be executed directly from this directory.
result-dir = ../../results/MC04/${configname}
record-eventlog = false

# ---------------------------------------------------------------------------
# Ethernet
# ---------------------------------------------------------------------------

*.*.eth[*].bitrate = 100Mbps

# gPTP requires transmission-start and reception-start timestamps.
*.*.eth[*].phyLayer.transmitter.typename = "StreamingTransmitter"
*.*.eth[*].phyLayer.receiver.typename = "DestreamingReceiver"

# ---------------------------------------------------------------------------
# Scheduled application traffic
# ---------------------------------------------------------------------------

*.source.numApps = 1
*.source.app[0].typename = "UdpSourceApp"
*.source.app[0].display-name = "scheduled"
*.source.app[0].io.destAddress = "receiver"
*.source.app[0].io.destPort = 1000
*.source.app[0].source.packetNameFormat = "scheduled-%c"
*.source.app[0].source.packetLength = 200B

# One packet per TAS cycle, generated near the beginning of the TC1 window.
*.source.app[0].source.productionInterval = 1ms
*.source.app[0].source.initialProductionOffset = 1.05ms

# Packet generation follows the source local clock.
*.source.app[0].source.clockModule = "^.^.clock"

*.receiver.numApps = 1
*.receiver.app[0].typename = "UdpSinkApp"
*.receiver.app[0].display-name = "scheduled-sink"
*.receiver.app[0].io.localPort = 1000

# ---------------------------------------------------------------------------
# Stream identification and IEEE 802.1Q classification
# ---------------------------------------------------------------------------

*.source.hasOutgoingStreams = true

*.source.bridging.streamIdentifier.identifier.mapping = \
    [{stream: "scheduled", packetFilter: expr(has(udp) && udp.destPort == 1000)}]

*.source.bridging.streamCoder.encoder.mapping = \
    [{stream: "scheduled", vlan: 1, pcp: 5}]

# Only the final switch removes the C-Tag before delivery.
# switch1 must preserve it so switch2 can classify PCP 5 into TC1.
*.switch2.bridging.directionReverser.reverser.excludeEncapsulationProtocols = \
    ["ieee8021qctag"]

# ---------------------------------------------------------------------------
# Manual TAS on the two forwarding ports
# ---------------------------------------------------------------------------

*.switch*.hasEgressTrafficShaping = true

# On both switches, eth[1] is the interface toward the receiver.
*.switch*.eth[1].macLayer.queue.numTrafficClasses = 2

*.switch*.eth[1].macLayer.queue.*[0].display-name = "TC0"
*.switch*.eth[1].macLayer.queue.*[1].display-name = "TC1 - scheduled"

# One 1 ms cycle:
#   TC1: open from 0 to 200 us
#   TC0: open from 200 us to 1 ms
*.switch*.eth[1].macLayer.queue.transmissionGate[1].initiallyOpen = true
*.switch*.eth[1].macLayer.queue.transmissionGate[1].durations = [200us, 800us]

*.switch*.eth[1].macLayer.queue.transmissionGate[0].initiallyOpen = false
*.switch*.eth[1].macLayer.queue.transmissionGate[0].durations = [200us, 800us]

# Each switch executes the GCL using its own local clock.
*.switch*.eth[1].macLayer.queue.transmissionGate[*].clockModule = \
    "^.^.^.^.clock"

# ---------------------------------------------------------------------------
# Clock sampling and result recording
# ---------------------------------------------------------------------------

# Emit clock values periodically so drift and synchronization can be plotted.
*.source.clock.emitClockTimeInterval = 100us
*.switch*.clock.emitClockTimeInterval = 100us
*.receiver.clock.emitClockTimeInterval = 100us

*.source.clock.timeChanged.result-recording-modes = vector
*.switch*.clock.timeChanged.result-recording-modes = vector
*.receiver.clock.timeChanged.result-recording-modes = vector

# Record the oscillator drift applied to each node.
*.*.clock.oscillator.driftRateChanged.result-recording-modes = vector

# TAS state and its direct effects.
*.switch*.eth[1].macLayer.queue.transmissionGate[*].gateState.result-recording-modes = vector
*.switch*.eth[1].macLayer.queue.transmissionGate[*].guardBandState.result-recording-modes = vector

*.switch*.eth[1].macLayer.queue.queue[1].queueLength.result-recording-modes = \
    vector,last,max,timeavg

*.switch*.eth[1].macLayer.queue.queue[1].queueingTime.result-recording-modes = \
    vector,histogram

*.switch*.eth[1].macLayer.queue.queue[1].incomingPackets.result-recording-modes = count
*.switch*.eth[1].macLayer.queue.queue[1].outgoingPackets.result-recording-modes = \
    count,vector(packetBytes)

*.receiver.app[0].sink.packetLifeTime.result-recording-modes = \
    vector,histogram

# gPTP-specific measurements; these exist only in the gPTP configurations.
*.*.gptp.pdelay.result-recording-modes = vector
*.*.gptp.neighborRateRatio.result-recording-modes = vector
*.*.gptp.gmRateRatio.result-recording-modes = vector

# ===========================================================================
# Configurations
# ===========================================================================

[Config MC04IdealClocks]

description = "TAS with ideal local clocks and no gPTP"

*.source.clock.typename = "IdealClock"
*.switch*.clock.typename = "IdealClock"
*.receiver.clock.typename = "IdealClock"


[Config MC04DriftNoGptp]

description = "TAS with unsynchronized drifting local clocks"

# All nodes have independent, non-adjustable clocks.
*.source.clock.typename = "OscillatorBasedClock"
*.switch*.clock.typename = "OscillatorBasedClock"
*.receiver.clock.typename = "OscillatorBasedClock"

*.*.clock.oscillator.typename = "RandomDriftOscillator"
*.*.clock.oscillator.nominalTickLength = 10ns

# Different initial frequency errors make the GCLs diverge.
*.source.clock.oscillator.initialDriftRate = 20ppm
*.switch1.clock.oscillator.initialDriftRate = 80ppm
*.switch2.clock.oscillator.initialDriftRate = -80ppm
*.receiver.clock.oscillator.initialDriftRate = 40ppm

# A bounded random walk makes the synchronization interval observable.
*.*.clock.oscillator.changeInterval = 10ms
*.*.clock.oscillator.driftRateChange = uniform(-1ppm, 1ppm)
*.*.clock.oscillator.driftRateChangeLowerLimit = -100ppm
*.*.clock.oscillator.driftRateChangeUpperLimit = 100ppm


[Config MC04DriftGptp1ms]

description = "The same drifting oscillators synchronized by gPTP every 1 ms"

extends = MC04DriftNoGptp

# SettableClock is required because gPTP adjusts clock time and oscillator
# compensation.
*.source.clock.typename = "SettableClock"
*.switch*.clock.typename = "SettableClock"
*.receiver.clock.typename = "SettableClock"

*.source.hasTimeSynchronization = true
*.switch*.hasTimeSynchronization = true
*.receiver.hasTimeSynchronization = true

# Manual gPTP spanning tree:
# source (GM) -> switch1 -> switch2 -> receiver.
# source is the grandmaster.
*.source.gptp.gptpNodeType = "MASTER_NODE"
*.source.gptp.slavePort = ""
*.source.gptp.masterPorts = ["eth0"]

# switch1 receives synchronization on eth0 and forwards it on eth1.
*.switch1.gptp.gptpNodeType = "BRIDGE_NODE"
*.switch1.gptp.slavePort = "eth0"
*.switch1.gptp.masterPorts = ["eth1"]

# switch2 receives synchronization on eth0 and forwards it on eth1.
*.switch2.gptp.gptpNodeType = "BRIDGE_NODE"
*.switch2.gptp.slavePort = "eth0"
*.switch2.gptp.masterPorts = ["eth1"]

# receiver is the final slave.
*.receiver.gptp.gptpNodeType = "SLAVE_NODE"
*.receiver.gptp.slavePort = "eth0"
*.receiver.gptp.masterPorts = []

# Single gPTP domain.
*.*.gptp.domainNumber = 0

*.*.gptp.syncInterval = 1ms
*.*.gptp.syncInitialOffset = 250us

*.*.gptp.pdelayInterval = 1ms
*.*.gptp.pdelayInitialOffset = 100us


[Config MC04DriftGptp250us]

description = "gPTP with a shorter 250 us synchronization interval"

extends = MC04DriftGptp1ms

*.*.gptp.syncInterval = 250us
*.*.gptp.syncInitialOffset = 250us


[Config MC04DriftGptp5ms]

description = "gPTP with a longer 5 ms synchronization interval"

extends = MC04DriftGptp1ms

*.*.gptp.syncInterval = 5ms
*.*.gptp.syncInitialOffset = 250us

