[General]
network = Mc07FramePreemption

sim-time-limit = 2ms

result-dir = ../../results/MC07/${configname}

# O cenário é pequeno; mantemos todos os vectors necessários para validação.
**.scalar-recording = true
**.vector-recording = true

# Registra os fragmentos e os headers físicos gerados pela preempção.
*.recordPcap = true
**.dumpProtocols = "ethernetphy"

**.checksumMode = "computed"
**.fcsMode = "computed"

# WiredNetworkBase também configura automaticamente as tabelas MAC.
**.arp.typename = "GlobalArp"

# ---------------------------------------------------------------------------
# Ethernet
# ---------------------------------------------------------------------------

# Os enlaces de ingresso são rápidos para que a contenção relevante aconteça
# apenas na saída de 100 Mbit/s do switch.
*.sourcePreemptable.eth[0].bitrate = 1Gbps
*.sourceExpress.eth[0].bitrate = 1Gbps

*.switch.eth[0].bitrate = 1Gbps
*.switch.eth[1].bitrate = 1Gbps
*.switch.eth[2].bitrate = 100Mbps

*.receiver.eth[0].bitrate = 100Mbps

# ---------------------------------------------------------------------------
# Preemptable traffic
# ---------------------------------------------------------------------------

*.sourcePreemptable.numApps = 1
*.sourcePreemptable.app[0].typename = "UdpSourceApp"
*.sourcePreemptable.app[0].display-name = "preemptable source"

*.sourcePreemptable.app[0].io.destAddress = "receiver"
*.sourcePreemptable.app[0].io.destPort = 1000

*.sourcePreemptable.app[0].source.packetNameFormat = "preemptable-%c"

# 1472 B de payload + UDP/IP formam um pacote IP de 1500 B.
# O quadro ocupa aproximadamente 121 us no enlace de 100 Mbit/s,
# sem contar componentes físicos adicionais do modelo.
*.sourcePreemptable.app[0].source.packetLength = 1472B

# Apenas um pacote dentro dos 2 ms simulados.
*.sourcePreemptable.app[0].source.initialProductionOffset = 1ms
*.sourcePreemptable.app[0].source.productionInterval = 10s

# ---------------------------------------------------------------------------
# Express traffic
# ---------------------------------------------------------------------------

*.sourceExpress.numApps = 1
*.sourceExpress.app[0].typename = "UdpSourceApp"
*.sourceExpress.app[0].display-name = "express source"

*.sourceExpress.app[0].io.destAddress = "receiver"
*.sourceExpress.app[0].io.destPort = 1001

*.sourceExpress.app[0].source.packetNameFormat = "express-%c"
*.sourceExpress.app[0].source.packetLength = 64B
*.sourceExpress.app[0].source.productionInterval = 10s

# O instante de geração será definido em cada configuração.

# ---------------------------------------------------------------------------
# Receiver
# ---------------------------------------------------------------------------

*.receiver.numApps = 2

*.receiver.app[*].typename = "UdpSinkApp"

*.receiver.app[0].display-name = "preemptable sink"
*.receiver.app[0].io.localPort = 1000

*.receiver.app[1].display-name = "express sink"
*.receiver.app[1].io.localPort = 1001

# Permite ao receptor processar o tráfego IEEE 802.1Q recebido.
*.receiver.hasIncomingStreams = true

*.receiver.bridging.streamCoder.decoder.mapping = [{pcp: 0, stream: "preemptable"},{pcp: 4, stream: "express"}]

# ---------------------------------------------------------------------------
# Stream identification and IEEE 802.1Q encoding
# ---------------------------------------------------------------------------

*.sourcePreemptable.hasOutgoingStreams = true
*.sourceExpress.hasOutgoingStreams = true

*.sourcePreemptable.bridging.streamIdentifier.identifier.mapping = [{stream: "preemptable",packetFilter: expr(has(udp) && udp.destPort == 1000)}]

*.sourceExpress.bridging.streamIdentifier.identifier.mapping = [{stream: "express",packetFilter: expr(has(udp) && udp.destPort == 1001)}]

*.sourcePreemptable.bridging.streamCoder.encoder.mapping = [{stream: "preemptable", vlan: 1, pcp: 0}]

*.sourceExpress.bridging.streamCoder.encoder.mapping = [{stream: "express", vlan: 1, pcp: 4}]

# ===========================================================================
# Strict Priority without frame preemption
# ===========================================================================

[Config MC07StrictPriorityBase]
abstract = true

description = "Two traffic classes with Strict Priority and no frame preemption"

*.switch.hasEgressTrafficShaping = true

*.switch.eth[2].macLayer.queue.numTrafficClasses = 2

*.switch.eth[2].macLayer.queue.queue[0].display-name = \
    "TC0 - preemptable"

*.switch.eth[2].macLayer.queue.queue[1].display-name = \
    "TC1 - express"

# Ambos os gates ficam permanentemente abertos. Portanto, o mecanismo
# efetivo é Strict Priority, e não TAS.
*.switch.eth[2].macLayer.queue.transmissionGate[*].initiallyOpen = true
*.switch.eth[2].macLayer.queue.transmissionGate[*].durations = []

# ===========================================================================
# Frame preemption
# ===========================================================================

[Config MC07FramePreemptionBase]
abstract = true

description = "Express MAC preempts the transmission of preemptable frames"

# O receptor também precisa dos módulos preempting para reconhecer e
# remontar os fragmentos recebidos. Ativamos em todos os nós para manter
# os dois lados de cada enlace com interfaces compatíveis.
*.sourcePreemptable.hasFramePreemption = true
*.sourceExpress.hasFramePreemption = true
*.switch.hasFramePreemption = true
*.receiver.hasFramePreemption = true

# Com duas saídas e reverseOrder=true:
# PCP 4 -> saída 0 -> expressMacLayer
# PCP 0 -> saída 1 -> preemptableMacLayer
*.sourcePreemptable.eth[0].macLayer.outboundClassifier.typename = \
    "PcpTrafficClassClassifier"
*.sourceExpress.eth[0].macLayer.outboundClassifier.typename = \
    "PcpTrafficClassClassifier"
*.switch.eth[*].macLayer.outboundClassifier.typename = \
    "PcpTrafficClassClassifier"

*.sourcePreemptable.eth[0].macLayer.outboundClassifier.reverseOrder = true
*.sourceExpress.eth[0].macLayer.outboundClassifier.reverseOrder = true
*.switch.eth[*].macLayer.outboundClassifier.reverseOrder = true

# Explicitamos as filas do enlace que está sendo validado.
*.switch.eth[2].macLayer.expressMacLayer.queue.typename = "PacketQueue"
*.switch.eth[2].macLayer.expressMacLayer.queue.display-name = \
    "express queue"

*.switch.eth[2].macLayer.preemptableMacLayer.queue.typename = "PacketQueue"
*.switch.eth[2].macLayer.preemptableMacLayer.queue.display-name = \
    "preemptable queue"

# ===========================================================================
# Express packet generated 20 us after the preemptable packet
# ===========================================================================

[Config MC07StrictPriority20us]
extends = MC07StrictPriorityBase

description = "Strict Priority: express packet generated 20 us after preemptable"

*.sourceExpress.app[0].source.initialProductionOffset = 1.020ms

[Config MC07FramePreemption20us]
extends = MC07FramePreemptionBase

description = "Frame preemption: express packet generated 20 us after preemptable"

*.sourceExpress.app[0].source.initialProductionOffset = 1.020ms

# ===========================================================================
# Express packet generated 60 us after the preemptable packet
# ===========================================================================

[Config MC07StrictPriority60us]
extends = MC07StrictPriorityBase

description = "Strict Priority: express packet generated 60 us after preemptable"

*.sourceExpress.app[0].source.initialProductionOffset = 1.060ms

[Config MC07FramePreemption60us]
extends = MC07FramePreemptionBase

description = "Frame preemption: express packet generated 60 us after preemptable"

*.sourceExpress.app[0].source.initialProductionOffset = 1.060ms

# ===========================================================================
# Express packet generated 100 us after the preemptable packet
# ===========================================================================

[Config MC07StrictPriority100us]
extends = MC07StrictPriorityBase

description = "Strict Priority: express packet generated 100 us after preemptable"

*.sourceExpress.app[0].source.initialProductionOffset = 1.100ms

[Config MC07FramePreemption100us]
extends = MC07FramePreemptionBase

description = "Frame preemption: express packet generated 100 us after preemptable"

*.sourceExpress.app[0].source.initialProductionOffset = 1.100ms