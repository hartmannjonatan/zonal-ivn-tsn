[General]
network = T1sFeasibility
sim-time-limit = 1s
seed-set = 1
result-dir = ../results/t1s_feasibility/${configname}

[Config Feasibility]
description = "TsnSwitch with a 10BASE-T1S PLCA port: UDP 64 B / 1 ms in both directions"

# ----------------------------------------------------------------------
# Interface bitrates (must match the channels in the NED file)
# ----------------------------------------------------------------------

*.gbDevice.eth[0].bitrate = 1Gbps
*.switch.eth[0].bitrate = 1Gbps
*.switch.eth[1].bitrate = 10Mbps
*.t1sDevice[*].eth[0].bitrate = 10Mbps

# ----------------------------------------------------------------------
# Applications: gbDevice -> t1sDevice[0] (port 1000) and back (port 1001)
# ----------------------------------------------------------------------

*.gbDevice.numApps = 2
*.gbDevice.app[0].typename = "UdpSourceApp"
*.gbDevice.app[0].display-name = "downlink"
*.gbDevice.app[0].io.destAddress = "t1sDevice[0]"
*.gbDevice.app[0].io.destPort = 1000
*.gbDevice.app[0].source.packetNameFormat = "downlink-%c"
*.gbDevice.app[0].source.packetLength = 64B
*.gbDevice.app[0].source.productionInterval = 1ms

*.gbDevice.app[1].typename = "UdpSinkApp"
*.gbDevice.app[1].display-name = "uplink-sink"
*.gbDevice.app[1].io.localPort = 1001

*.t1sDevice[0].numApps = 2
*.t1sDevice[0].app[0].typename = "UdpSourceApp"
*.t1sDevice[0].app[0].display-name = "uplink"
*.t1sDevice[0].app[0].io.destAddress = "gbDevice"
*.t1sDevice[0].app[0].io.destPort = 1001
*.t1sDevice[0].app[0].source.packetNameFormat = "uplink-%c"
*.t1sDevice[0].app[0].source.packetLength = 64B
*.t1sDevice[0].app[0].source.productionInterval = 1ms

*.t1sDevice[0].app[1].typename = "UdpSinkApp"
*.t1sDevice[0].app[1].display-name = "downlink-sink"
*.t1sDevice[0].app[1].io.localPort = 1000

# ----------------------------------------------------------------------
# Recording
# ----------------------------------------------------------------------

**.app[*].packetSent.statistic-recording = true
**.app[*].packetReceived.statistic-recording = true
**.app[*].*.result-recording-modes = default,+histogram
