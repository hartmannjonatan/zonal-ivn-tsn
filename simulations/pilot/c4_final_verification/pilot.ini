# Pilot-only additions. Loaded alongside simulations/omnetpp.ini; never included
# by the official campaign or by the common P1 configuration. Time resolution
# inherits the OMNeT++ default, matching the official campaign.

[Config PilotGptp]
description = "Isolated C4 pilot gPTP domain, TC7 control traffic, and instrumentation"
num-rngs = 4
*.trafficPlan.rng-0 = 0
*.trafficPlan.rng-1 = 1

# gPTP nodes only: the HPC is the grandmaster, CSW and the zonal switches relay.
*.HPC.hasTimeSynchronization = true
*.CSW.hasTimeSynchronization = true
*.Z*.ZSW.hasTimeSynchronization = true
**.gptp.syncInterval = 125ms
**.gptp.pdelayInterval = 1s
# gPTP timestamps reception/transmission boundaries; INET's signal-based
# measurements require the streaming Ethernet transmitter/receiver pair.
**.transmitter.typename = "StreamingTransmitter"
**.receiver.typename = "DestreamingReceiver"
*.HPC.gptp.gptpNodeType = "MASTER_NODE"
*.HPC.gptp.masterPorts = ["eth0"]
*.HPC.gptp.slavePort = ""
*.CSW.gptp.gptpNodeType = "BRIDGE_NODE"
*.CSW.gptp.slavePort = "eth0"
*.CSW.gptp.masterPorts = ["eth1", "eth2", "eth3"]
*.Z*.ZSW.gptp.gptpNodeType = "SLAVE_NODE"
*.Z*.ZSW.gptp.slavePort = "eth0"
*.Z*.ZSW.gptp.masterPorts = []

# Catalog packets retain the identity PCP mapping. gPTP packets have no PCP
# request/indication and therefore use the explicit default output TC7.
*.HPC.eth[*].macLayer.queue.classifier.defaultGateIndex = 7
*.CSW.eth[*].macLayer.queue.classifier.defaultGateIndex = 7
*.Z*.ZSW.eth[*].macLayer.queue.classifier.defaultGateIndex = 7
# gPTP control packets are non-UDP. Guard catalog stream filters before
# accessing udp.destPort so the pilot can classify catalog flows safely while
# the gPTP packets pass through the same network nodes.
*.LiDAR1.bridging.streamIdentifier.identifier.mapping = [{stream: "F01", packetFilter: expr(has(udp) && udp.destPort == 5001)}]
*.HPC.bridging.streamIdentifier.identifier.mapping = [{stream: "F08", packetFilter: expr(has(udp) && udp.destPort == 5008)}, {stream: "F09", packetFilter: expr(has(udp) && udp.destPort == 5009)}, {stream: "F10", packetFilter: expr(has(udp) && udp.destPort == 5010)}, {stream: "F11", packetFilter: expr(has(udp) && udp.destPort == 5011)}, {stream: "F12", packetFilter: expr(has(udp) && udp.destPort == 5012)}, {stream: "F13", packetFilter: expr(has(udp) && udp.destPort == 5013)}, {stream: "F14", packetFilter: expr(has(udp) && udp.destPort == 5014)}, {stream: "F15", packetFilter: expr(has(udp) && udp.destPort == 5015)}, {stream: "F16", packetFilter: expr(has(udp) && udp.destPort == 5016)}, {stream: "F17", packetFilter: expr(has(udp) && udp.destPort == 5017)}, {stream: "F18", packetFilter: expr(has(udp) && udp.destPort == 5018)}, {stream: "F19", packetFilter: expr(has(udp) && udp.destPort == 5019)}, {stream: "F20", packetFilter: expr(has(udp) && udp.destPort == 5020)}]
*.CAM1.bridging.streamIdentifier.identifier.mapping = [{stream: "F02", packetFilter: expr(has(udp) && udp.destPort == 5002)}]
*.CAM2.bridging.streamIdentifier.identifier.mapping = [{stream: "F03", packetFilter: expr(has(udp) && udp.destPort == 5003)}]
*.CAM3.bridging.streamIdentifier.identifier.mapping = [{stream: "F04", packetFilter: expr(has(udp) && udp.destPort == 5004)}]
*.CAM4.bridging.streamIdentifier.identifier.mapping = [{stream: "F05", packetFilter: expr(has(udp) && udp.destPort == 5005)}]
*.RADAR1.bridging.streamIdentifier.identifier.mapping = [{stream: "F06", packetFilter: expr(has(udp) && udp.destPort == 5006)}]
*.RADAR2.bridging.streamIdentifier.identifier.mapping = [{stream: "F07", packetFilter: expr(has(udp) && udp.destPort == 5007)}]
*.Z1.ZCPU.bridging.streamIdentifier.identifier.mapping = [{stream: "F21", packetFilter: expr(has(udp) && udp.destPort == 5021)}]
*.Z2.ZCPU.bridging.streamIdentifier.identifier.mapping = [{stream: "F22", packetFilter: expr(has(udp) && udp.destPort == 5022)}]

# Deterministic drift values are supplied by run_pilot.py for each seed/node.
**.clock.oscillator.typename = "ConstantDriftOscillator"
**.clock.oscillator.nominalTickLength = 10ns
**.clock.emitClockTimeInterval = 1ms
**.clock.timeChanged.result-recording-modes = vector

# Compactly auditable state and synchronization evidence.
**.transmitting.result-recording-modes = +vector
**.transmissionGate[*].gateState.result-recording-modes = +vector
**.transmissionGate[*].guardBandState.result-recording-modes = +vector
**.clock.timeChanged.result-recording-modes = +vector
**.gptp.gmRateRatio.result-recording-modes = +vector
**.gptp.neighborRateRatio.result-recording-modes = +vector
**.gptp.pdelay.result-recording-modes = +vector
**.gptp.packetDropNotAddressedToUs.result-recording-modes = +count,sum(packetBytes),vector(packetBytes)
**.numCredits.result-recording-modes = vector,max,min,timeavg
**.gptp.cmdenv-log-level = info

