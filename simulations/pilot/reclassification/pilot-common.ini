# Shared official model/configuration base for the isolated mapping pilot.
# No official P1 or mechanism INI is edited by this pilot.
include ../../zonal/configs/base.ini
include ../../zonal/configs/topology.ini
include ../../zonal/configs/recording.ini
include ../../zonal/configs/classification.ini
include ../../zonal/configs/loads.ini
include ../../zonal/configs/aggregation.ini
include ../../zonal/configs/traffic.ini
include ../../zonal/configs/mechanisms/C0_strict_priority.ini
include ../../zonal/configs/mechanisms/C1_source_preshaping.ini
include ../../zonal/configs/mechanisms/C2_nominal_cbs.ini
include ../../zonal/configs/mechanisms/C2_nominal_rates.ini

[General]
image-path = ../../../images
network = zonal_ivn_tsn.simulations.zonal.networks.ZonalIVN

# Every pilot run records packet latency, camera image completion, all class
# queue occupancies, overflow samples, queueing delay and physical utilization.
**.vector-recording = true
**.result-recording-modes = -vector
**.app[*].latency.result-recording-modes = vector,histogram
**.app[*].imageCompletionLatency.result-recording-modes = vector,histogram
*.HPC.eth[0].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,last,max,timeavg
*.HPC.eth[0].macLayer.queue.queue[*].queueBitLength.result-recording-modes = vector,last,max,timeavg
*.LiDAR1.eth[0].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,last,max,timeavg
*.LiDAR1.eth[0].macLayer.queue.queue[*].queueBitLength.result-recording-modes = vector,last,max,timeavg
*.CAM*.eth[0].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,last,max,timeavg
*.CAM*.eth[0].macLayer.queue.queue[*].queueBitLength.result-recording-modes = vector,last,max,timeavg
*.RADAR*.eth[0].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,last,max,timeavg
*.RADAR*.eth[0].macLayer.queue.queue[*].queueBitLength.result-recording-modes = vector,last,max,timeavg
*.Z*.ZCPU.eth[0].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,last,max,timeavg
*.Z*.ZCPU.eth[0].macLayer.queue.queue[*].queueBitLength.result-recording-modes = vector,last,max,timeavg
*.Z*.ZSW.eth[0..1].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,last,max,timeavg
*.Z*.ZSW.eth[0..1].macLayer.queue.queue[*].queueBitLength.result-recording-modes = vector,last,max,timeavg
*.Z*.ZSW.eth[2..8].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,last,max,timeavg
*.Z*.ZSW.eth[2..8].macLayer.queue.queue[*].queueBitLength.result-recording-modes = vector,last,max,timeavg
*.CSW.eth[*].macLayer.queue.queue[*].queueLength.result-recording-modes = vector,last,max,timeavg
*.CSW.eth[*].macLayer.queue.queue[*].queueBitLength.result-recording-modes = vector,last,max,timeavg
**.eth[*].macLayer.queue.queue[*].droppedPacketLengthsQueueOverflow.result-recording-modes = +vector
**.utilization.result-recording-modes = +histogram
**.queueingTime.result-recording-modes = +histogram
