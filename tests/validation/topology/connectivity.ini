# Diagnostic ICMP probes only; not flows F01-F22 and not a C0 benchmark.
# Loaded by simulations/omnetpp.ini; run from that entry point.
[Config TopologyConnectivity]
extends = TopologyValidation
description = "Reach all 24 non-HPC endpoints and verify local/cross-zone CPU paths"
*.HPC.numApps = 1
*.HPC.app[0].typename = "PingApp"
*.HPC.app[0].destAddr = "LiDAR1 CAM1 BRAKE1 WINDOW1 AUDIO1 DISPLAY1 BE1 RADAR1 CAM2 BRAKE2 WINDOW2 AUDIO2 DISPLAY2 BE2 RADAR2 CAM3 CAM4 BRAKE3 WINDOW3 AUDIO3 BE3 Z1.ZCPU Z2.ZCPU Z3.ZCPU"

# P3: local sensor -> local processor, without visiting the central backbone.
*.LiDAR1.numApps = 1
*.LiDAR1.app[0].typename = "PingApp"
*.LiDAR1.app[0].destAddr = "Z1.ZCPU"

# P4: both front processors -> rear processor.
*.Z1.ZCPU.numApps = 1
*.Z2.ZCPU.numApps = 1
*.Z*.ZCPU.app[0].typename = "PingApp"
*.Z*.ZCPU.app[0].destAddr = "Z3.ZCPU"

**.app[0].count = 2
**.app[0].startTime = 10ms
**.app[0].sendInterval = 10ms
**.app[0].sleepDuration = 0s
**.app[0].printPing = true
